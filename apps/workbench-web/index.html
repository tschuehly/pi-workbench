<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbench Chat proof</title>
<style>body{font:16px system-ui;max-width:70ch;margin:2rem auto;padding:0 1rem;background:#161b22;color:#eee}button,input,textarea,select{font:inherit}textarea{box-sizing:border-box;width:100%;background:#202833;color:inherit;border:1px solid #667;padding:.6rem}select{max-width:100%}nav{border:1px solid #667;padding:.6rem}nav [aria-current]{outline:2px solid #8cf}nav ul{list-style:none;padding:0;margin:0}nav li{margin:.2rem 0}button{margin:.4rem;padding:.4rem}article{border:1px solid #667;padding:.7rem;margin:.7rem 0;white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:.6rem 0}input{max-width:100%} :focus-visible{outline:3px solid #8cf}</style>
<main><h1>Chat proof</h1><nav aria-label="Chat selection"><div id="catalog"></div><p id="catalog-error" role="alert"></p></nav><p id="connection" role="status"></p><p id="error" role="alert"></p><button id="earlier" type="button">Earlier messages</button><section id="history" aria-label="Transcript"></section><section id="partial" aria-label="Streaming assistant"></section><section id="queued" aria-label="Queued messages" aria-live="polite"></section><section id="ask" aria-label="Pending question"></section><section id="dialogs" aria-label="Extension dialogs" aria-live="polite"></section><section id="controls" aria-label="Model controls"><label for="model">Model <select id="model" disabled></select></label><label for="thinking">Thinking <select id="thinking" disabled></select></label></section><form id="composer"><label for="draft">Message</label><textarea id="draft" rows="4" aria-label="Message" placeholder="Message Pi · Enter to send, Shift+Enter for a new line"></textarea><div><button id="send" type="submit">Send</button><button id="queue" type="button" hidden>Queue for later</button><button id="stop" type="button" hidden>Stop</button></div></form></main>
<script type="module" src="./main.mjs"></script></html>
