<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PI WEB — Unified Chats + Workstreams Prototype</title>
<!-- THROWAWAY PROTOTYPE — one coherent Chat/Workstream shell for human validation.
     Middle destinations: standalone Chat, Workstream brief, Workstream session.
     Session tools (Chat/Context/Files/Git) replace the main surface; Terminal is a bottom pane.
     Live ask_user decisions live inline in Chat; durable Human Tasks live in Workstream Context.
     Bounded subagent child executions are inspectable evidence under their session, not peer sessions.
     This prototype does not claim standalone sessions or promotion are supported by the current protocol. -->
<style>
:root{color-scheme:dark;--bg:#0d1117;--canvas:#010409;--surface:#161b22;--surface2:#21262d;--hover:#262c36;--border:#30363d;--muted:#8b949e;--text:#c9d1d9;--bright:#f0f6fc;--accent:#58a6ff;--accent2:#1f6feb;--green:#3fb950;--green-bg:#12261e;--orange:#d29922;--orange-bg:#2d2108;--purple:#a371f7;--red:#f85149;--red-bg:#2a1315;--add:#12261e;--add-t:#3fb950;--del:#2a1315;--del-t:#f85149;--shadow:0 12px 34px #0008;--radius:6px}
html[data-theme="light"]{color-scheme:light;--bg:#f6f8fa;--canvas:#fff;--surface:#f6f8fa;--surface2:#eaeef2;--hover:#afb8c133;--border:#d0d7de;--muted:#57606a;--text:#24292f;--bright:#1f2328;--accent:#0969da;--accent2:#0969da;--green:#1a7f37;--green-bg:#dafbe1;--orange:#9a6700;--orange-bg:#fff8c5;--purple:#8250df;--red:#cf222e;--red-bg:#ffebe9;--add:#dafbe1;--add-t:#1a7f37;--del:#ffebe9;--del-t:#cf222e;--shadow:0 12px 34px #1f232826}
*{box-sizing:border-box}html,body,#root{height:100%;margin:0;overflow:hidden}body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--bright);padding:7px 11px;cursor:pointer}button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{border-color:var(--accent2);background:var(--accent2);color:#fff;font-weight:650}.primary:hover{filter:brightness(1.08)}.ghost{border-color:transparent;background:transparent}.icon{min-width:32px;justify-content:center;padding:7px}.small{padding:4px 8px;font-size:12px}.danger{color:var(--red)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.ic.sm{width:14px;height:14px}
.label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:5px;width:max-content;border-radius:20px;background:var(--surface2);padding:2px 8px;color:var(--muted);font-size:11px}.badge.green{background:var(--green-bg);color:var(--green)}.badge.orange{background:var(--orange-bg);color:var(--orange)}.badge.red{background:var(--red-bg);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}.muted{color:var(--muted)}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1,h2,h3,p{margin:0}h1{font-size:17px;color:var(--bright)}h2{font-size:14px;color:var(--bright)}h3{font-size:13px;color:var(--bright)}
.app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr);background:var(--canvas)}
/* top bar */
.topbar{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--surface);padding:0 12px}
.pi-mark{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--bright);color:var(--canvas);font-weight:900;cursor:pointer}
.brand{padding:0;border:0;background:transparent}.brand[aria-expanded="true"] .pi-mark{outline:2px solid var(--accent);outline-offset:1px}
.scope{min-width:0;display:flex;align-items:baseline;gap:9px}.scope strong{color:var(--bright)}.topbar .push{margin-left:auto;display:flex;align-items:center;gap:8px}
.prototag{padding:2px 7px;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.09em}
.narrow-only{display:none}
/* menus */
.menu{position:fixed;z-index:90;min-width:236px;padding:6px;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:var(--shadow)}
.menu button{width:100%;justify-content:flex-start;gap:10px;border:0;border-radius:6px;background:transparent;padding:8px 9px;text-align:left;color:var(--text)}
.menu button:hover{background:var(--hover);color:var(--bright)}.menu .menu-label{display:block;padding:6px 8px 3px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}
.menu .sep{height:1px;margin:5px 4px;background:var(--border)}.menu .kbd{margin-left:auto;color:var(--muted);font-size:11px}
.menu-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 8px 9px}.menu-head small{display:block;color:var(--muted)}
/* body */
.body{min-height:0;display:grid;grid-template-columns:var(--lw,290px) var(--lr,4px) minmax(0,1fr)}
.left-panel,.slot-left{grid-column:1}.left-resizer,.slot-lr{grid-column:2}.center{grid-column:3}
.panel{min-width:0;min-height:0;overflow:auto;background:var(--surface)}.left-panel{border-right:1px solid var(--border);display:flex;flex-direction:column}
.resizer{position:relative;z-index:8;background:var(--border);cursor:col-resize;touch-action:none;user-select:none}.resizer:hover,.resizer.dragging{background:color-mix(in srgb,var(--accent) 45%,var(--border))}
/* left nav */
.nav-head{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);padding:8px 8px 8px 10px}
.nav-head .ws-identity{flex:1;min-width:0}.nav-scroll{flex:1;min-height:0;overflow:auto}
.ws-identity{display:flex;align-items:center;gap:8px;min-width:0;border-color:transparent;background:transparent;padding:6px;text-align:left}
.ws-identity:hover{background:var(--hover)}.ws-identity.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}.ws-identity strong{display:block;font-size:14px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:12px 10px 4px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.05em;text-transform:uppercase}.section-title span{display:flex;align-items:center;gap:6px}
.nav-list{display:grid;gap:2px;padding:0 8px}
.nav-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;border-color:transparent;background:transparent;padding:8px;text-align:left}
.nav-row:hover{background:var(--hover)}.nav-row.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}.nav-row .meta{display:block;color:var(--muted);font-size:11px}
.session-row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:9px;width:100%;border:0;border-radius:0;background:transparent;padding:11px 10px;text-align:left}
.session-row:hover{background:var(--hover)}.session-row.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.session-row .ic{margin-top:1px;color:var(--muted)}.session-row.selected .ic{color:var(--accent)}.session-row strong,.session-row small{display:block}.session-row small{margin-top:3px;color:var(--muted);line-height:1.35}
.sessions-wrap{border-bottom:1px solid var(--border)}
/* subagent child executions */
.child-block{margin:0 8px 6px 26px;border-left:1px solid var(--border);padding-left:8px}
.child-toggle{width:100%;justify-content:flex-start;gap:6px;border:0;background:transparent;padding:6px 4px;color:var(--muted);font-size:11px;font-weight:700}
.child-toggle:hover{background:transparent;color:var(--bright)}.child-toggle .chev{transition:transform .15s}.child-toggle.open .chev{transform:rotate(90deg)}
.child-row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;border:0;border-radius:5px;background:transparent;padding:7px 5px;text-align:left;font-size:11px}
.child-row:hover{background:var(--hover)}.child-row.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.child-row .cdot{width:7px;height:7px;margin-top:4px;border-radius:50%;background:var(--muted)}.child-row .cdot.running{background:var(--green)}.child-row .cdot.warning{background:var(--orange)}.child-row .cdot.success{background:var(--accent)}
.child-row strong{display:block}.child-row small{color:var(--muted)}
.count{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
/* center */
.center{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--canvas)}
.workstream-strip{display:flex;align-items:center;gap:4px;min-height:44px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface);padding:6px 10px;flex:0 0 auto}
.workstream-strip button{flex:0 0 auto;border-color:transparent;background:transparent;padding:5px 9px;color:var(--muted)}
.workstream-strip button:hover{background:var(--hover)}.workstream-strip button.active{border-color:var(--border);background:var(--canvas);color:var(--bright);font-weight:650}
.workstream-strip .strip-id{font-weight:700;color:var(--bright)}.strip-div{width:1px;height:22px;background:var(--border);flex:0 0 auto;margin:0 2px}
.session-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding:11px 16px;flex:0 0 auto}
.session-head .st-title{min-width:0}.session-head .crumbs{margin-top:3px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}.session-head .acts{display:flex;gap:7px;flex:0 0 auto}
.tool-bar{display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border);padding:8px 12px;flex:0 0 auto;background:var(--surface)}
.tool-bar .tabs{display:flex;gap:4px}.tool-bar button{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
.tool-bar button:hover{background:var(--hover)}.tool-bar button.active{border-color:var(--border);background:var(--canvas);color:var(--accent);font-weight:650}
.tool-bar .spacer{flex:1}.tool-bar .term-btn.active{border-color:var(--border);background:var(--canvas);color:var(--green)}
.surface-wrap{flex:1 1 auto;min-height:0;display:flex;min-width:0}
/* chat surface */
.chat{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.messages{flex:1;min-height:0;overflow:auto;padding:22px max(20px,calc((100% - 860px)/2));scrollbar-color:var(--border) transparent}
.exchange{border-bottom:1px solid var(--border);padding:0 4px 20px;margin-bottom:20px}
.message-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--muted);font-size:11px}
.role{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.04em}.assistant .role{color:var(--purple)}
.message-copy{color:var(--bright);font-size:15px;line-height:1.6}.event-fold{display:flex;align-items:center;gap:7px;margin:14px 0 0;border-top:1px solid var(--border);padding-top:11px;color:var(--muted);font-weight:650;font-size:12px}
.composer{border-top:1px solid var(--border);padding:12px max(16px,calc((100% - 900px)/2)) 14px;flex:0 0 auto}
.composer-box{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;border:1px solid var(--border);border-radius:9px;background:var(--canvas);padding:10px}
.composer input{min-width:0;border:0;outline:0;background:transparent;color:var(--bright);padding:5px}
.composer-meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:11px}
/* live decision */
.live-decision{margin:6px 4px 2px;border:1px solid var(--accent2);border-radius:9px;background:color-mix(in srgb,var(--accent) 9%,var(--canvas));padding:13px}
.live-decision .ld-tag{display:flex;align-items:center;gap:7px;margin-bottom:5px;color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.04em;text-transform:uppercase}
.live-decision h3{font-size:14px;line-height:1.35}.live-decision p{margin:5px 0 10px;color:var(--muted);font-size:12px}
.ld-options{display:flex;flex-wrap:wrap;gap:6px}.ld-options button{padding:5px 10px}
.ld-correct{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:9px}
.ld-correct textarea,.ld-text textarea{width:100%;min-height:52px;resize:vertical;border:1px solid var(--border);border-radius:7px;background:var(--canvas);color:var(--bright);padding:8px}
.ld-text{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end}
.ld-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.ld-outcome{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--green);font-size:12px}
.ld-linkbtn{border:0;background:transparent;color:var(--accent);padding:0}
/* files finder */
.files{flex:1;min-width:0;display:grid;grid-template-columns:var(--tree,260px) 1fr}
.tree{overflow:auto;border-right:1px solid var(--border);background:var(--surface);padding:8px}
.tree-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.05em;text-transform:uppercase}
.tnode{width:100%;display:flex;align-items:center;gap:7px;border:0;border-radius:5px;background:transparent;padding:5px 6px;text-align:left;color:var(--text)}
.tnode:hover{background:var(--hover)}.tnode.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--bright)}
.tnode .chev{color:var(--muted);transition:transform .12s}.tnode.open .chev{transform:rotate(90deg)}.tnode .ic.folder{color:var(--accent)}.tnode .ic.file{color:var(--muted)}
.file-view{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--canvas)}
.file-view header{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:10px 14px;color:var(--muted);font-size:12px}
.code{flex:1;min-height:0;overflow:auto;margin:0;padding:16px 18px;color:var(--text);font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:2}
.code .cm{color:var(--muted)}.code .kw{color:var(--purple)}.code .st{color:var(--green)}
/* git diff */
.git{flex:1;min-width:0;display:grid;grid-template-columns:var(--tree,270px) 1fr}
.changes{overflow:auto;border-right:1px solid var(--border);background:var(--surface);padding:8px}
.change-row{width:100%;display:flex;align-items:center;gap:9px;border:0;border-radius:5px;background:transparent;padding:7px 8px;text-align:left;color:var(--text)}
.change-row:hover{background:var(--hover)}.change-row.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--bright)}
.stat{display:grid;place-items:center;width:18px;height:18px;border-radius:4px;font-size:11px;font-weight:750;flex:0 0 auto}.stat.M{background:var(--orange-bg);color:var(--orange)}.stat.A{background:var(--green-bg);color:var(--green)}.stat.D{background:var(--red-bg);color:var(--red)}
.diff{min-width:0;min-height:0;overflow:auto;background:var(--canvas)}
.diff-head{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:10px 14px;color:var(--muted);font:12px ui-monospace,monospace}
.dline{display:grid;grid-template-columns:52px 1fr;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
.dline .gutter{padding:0 10px;color:var(--muted);text-align:right;user-select:none;border-right:1px solid var(--border)}
.dline .txt{padding:0 12px}.dline.add{background:var(--add)}.dline.add .txt{color:var(--add-t)}.dline.del{background:var(--del)}.dline.del .txt{color:var(--del-t)}
/* context surface */
.ctx{flex:1;min-width:0;min-height:0;overflow:auto;background:var(--canvas)}
.ctx-inner{max-width:820px;margin:0 auto;padding:20px 22px 40px}
.panel-section{border-bottom:1px solid var(--border);padding:16px 0}.panel-section:last-child{border-bottom:0}
.ctx-link{border:0;background:transparent;color:var(--accent);padding:6px 0 0}
.checkpoint-box{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:11px}.checkpoint-box p{margin:6px 0 0;color:var(--text)}
.link-row{display:flex;align-items:center;gap:9px;padding:6px 0;color:var(--text)}
/* durable Human Task cards */
.task-card{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px;margin-bottom:10px}.task-card:last-child{margin-bottom:0}
.task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.task-card h3{font-size:13px;line-height:1.35}.task-card p{margin:5px 0 9px;color:var(--muted);font-size:12px}
.task-prov{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:9px;color:var(--muted);font-size:11px}
.task-answers{display:flex;flex-wrap:wrap;gap:6px}.task-answers button{padding:5px 9px}
.task-text{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}.task-text textarea{width:100%;min-height:54px;resize:vertical;border:1px solid var(--border);border-radius:7px;background:var(--canvas);color:var(--bright);padding:8px}
.task-answered{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--border);margin-top:9px;padding-top:9px;color:var(--green);font-size:12px}
.task-resolve{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--border);margin-top:9px;padding-top:9px;font-size:12px}
.task-open{border:0;background:transparent;color:var(--accent);padding:0}
/* terminal bottom pane */
.terminal-pane{flex:0 0 auto;display:flex;flex-direction:column;border-top:1px solid var(--border);background:#010409;min-height:120px}
.term-resize{height:6px;margin-top:-6px;cursor:row-resize;background:transparent;touch-action:none}.term-resize:hover{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.term-head{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:7px 12px;color:var(--muted);font-size:12px}.term-head .push{margin-left:auto;display:flex;gap:6px}
.term-body{flex:1;min-height:0;overflow:auto;padding:12px 14px;color:#7ee787;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.term-body .p{color:var(--accent)}.term-body .m{color:var(--muted)}
/* child chat (subagent inspect) */
.child-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--surface);padding:11px 16px;flex:0 0 auto}
.child-glyph{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--surface2);color:var(--accent);font-weight:800;font-size:13px}
.child-head .hmeta{min-width:0}.child-head .hmeta strong,.child-head .hmeta small{display:block}.child-head .hmeta small{color:var(--muted);margin-top:2px}.child-head .st{margin-left:auto}
.child-body{flex:1;min-height:0;overflow:auto;padding:20px max(20px,calc((100% - 820px)/2))}
.cmsg{margin:0 0 20px;line-height:1.55}.cmsg.input{padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.ctool{margin:0 0 14px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--muted);font:12px/1.5 ui-monospace,monospace}
.cresult{margin-top:6px;padding:12px;border-radius:8px;background:var(--green-bg);color:var(--green)}.cresult.warning{background:var(--orange-bg);color:var(--orange)}
.child-note{border-top:1px solid var(--border);background:var(--surface);padding:11px 16px;color:var(--muted);font-size:12px;flex:0 0 auto;display:flex;align-items:center;gap:10px}.child-note strong{color:var(--bright)}
.st-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700}.st-pill.running,.st-pill.success{background:var(--green-bg);color:var(--green)}.st-pill.warning,.st-pill.cancelling{background:var(--orange-bg);color:var(--orange)}.st-pill.cancelled{background:var(--red-bg);color:var(--red)}.st-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
/* brief */
.brief{flex:1;min-width:0;min-height:0;overflow:auto;background:var(--canvas)}
.brief-inner{max-width:1040px;padding:26px clamp(22px,5vw,56px) 56px}
.brief-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;margin-bottom:24px}
.brief-head h1{font-size:22px;letter-spacing:-.02em;margin-top:9px}.brief-head .brief-meta{margin-top:5px;color:var(--muted);font-size:12px}.brief-actions{display:flex;gap:7px;flex:0 0 auto}
.brief-h{margin-bottom:12px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}
.brief-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:40px;padding-top:18px;border-top:1px solid var(--border)}
.continuation{font-size:17px;font-weight:650;color:var(--bright);line-height:1.42}
.since{margin-top:14px;color:var(--text);font-size:13px;line-height:1.5}.since-label{color:var(--muted);font-weight:650}

.backdrop{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:#010409a8;padding:18px;backdrop-filter:blur(3px)}

.dialog h2{font-size:18px}.dialog p{margin:7px 0 14px;color:var(--muted)}.dialog label{display:grid;gap:6px;margin:12px 0;color:var(--bright);font-weight:650}

/* ---------- conversation + live decision ---------- */
function liveDecisionCard(){
 const e=currentEntity(),d=e.decision,key=scopeKey();if(!d)return'';
 const st=state.live[key]||{status:'pending',mode:d.kind==='text'?'text':'choice',correcting:false,value:''};state.live[key]=st;
 let inner;
 if(st.status==='submitting')inner=`<div class="ld-status"><span class="dot" style="background:var(--orange)"></span>Submitting your answer…</div>`;
 else if(st.status==='answered')inner=`<div class="ld-outcome"><span>Answered · <strong>${esc(st.value)}</strong> · sent to the live session</span><button class="ld-linkbtn" data-live-correct>Correct</button></div>`;
 else if(st.mode==='text'||st.correcting)inner=`<div class="${st.correcting?'ld-correct':'ld-text'}"><textarea data-live-draft placeholder="Type your answer…">${esc(st.value||'')}</textarea><button class="primary" data-live-submit>${icon('send','sm')}Send</button></div>`;
 else inner=`<div class="ld-options">${d.options.map(o=>`<button data-live-option="${esc(o)}">${esc(o)}</button>`).join('')}</div><button class="ld-linkbtn" data-live-type style="margin-top:8px">Write a different answer</button>`;
 return `<div class="live-decision"><div class="ld-tag"><span class="dot" style="background:var(--accent)"></span>Live decision · needs you now</div><h3>${esc(d.prompt)}</h3><p>${esc(d.detail)}</p>${inner}</div>`;
}

/* ---------- files finder ---------- */
function treeNodes(nodes,prefix){
 return nodes.map(n=>{const path=prefix?prefix+'/'+n.name:n.name;const depth=(path.match(/\//g)||[]).length;const pad=`style="padding-left:${8+depth*14}px"`;
  if(n.t==='d'){const open=state.foldersOpen[path];return `<button class="tnode ${open?'open':''}" ${pad} data-folder="${esc(path)}">${icon('chevron','sm')}<span class="chev"></span>${icon('folder','folder')}<span class="truncate">${esc(n.name)}</span></button>${open?treeNodes(n.kids,path):''}`;}
  return `<button class="tnode ${state.fileOpen===path?'on':''}" ${pad} data-file="${esc(path)}"><span style="width:14px"></span>${icon('file','file')}<span class="truncate">${esc(n.name)}</span></button>`;
 }).join('');
}
function filesSurface(){

function gitSurface(){

 const rows=diff.map(([t,n,txt])=>`<div class="dline ${t==='add'?'add':t==='del'?'del':''}"><span class="gutter">${t==='del'?'-':t==='add'?'+':n}</span><span class="txt">${esc(txt)}</span></div>`).join('');
 return `<div class="git"><aside class="changes"><div class="tree-head"><span>${icon('git','sm')} Changes · ${gitChanges.length}</span></div>${list}</aside><div class="diff"><div class="diff-head">${esc(e.anchor)} · ${esc(state.gitFile)}</div>${rows}</div></div>`;

function durableTaskCard(id){
 const t=humanTasks[id],answer=state.taskAnswers[id],resolved=state.taskResolved[id];
 let answerArea;
 if(answer)answerArea=`<div class="task-answered"><span>${icon('check','sm')} Answered: <strong>${esc(answer)}</strong> · ${esc(state.taskAnswerAt[id]||'just now')}</span><button class="task-open" data-task-clear="${id}">Change</button></div>`;
 else if(t.kind==='text')answerArea=`<div class="task-text"><textarea data-task-draft="${id}" placeholder="Type your answer…"></textarea><button class="primary" data-task-submit="${id}">${icon('send','sm')}Send</button></div>`;
 else answerArea=`<div class="task-answers">${t.options.map(o=>`<button data-task-answer="${id}|${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
 const resolveRow=answer?`<div class="task-resolve"><span class="badge ${resolved?'green':'orange'}">${resolved?'Resolved':'Open · awaiting resolution'}</span>${resolved?`<button class="task-open" data-task-reopen="${id}">Reopen</button>`:`<button class="small" data-task-resolve="${id}">${icon('check','sm')}Resolve</button>`}</div>`:'';
 return `<article class="task-card"><div class="task-top"><h3>${esc(t.title)}</h3><span class="badge ${t.materiality.startsWith('High')?'red':t.materiality.startsWith('Medium')?'orange':''}">${esc(t.materiality.split(' · ')[0])}</span></div><p>${esc(t.detail)}</p><div class="task-prov">Source: <button class="task-open" data-open-source="${id}">${esc(sessions[t.source].title)}</button> · <span class="badge ${answer?'green':''}">${answer?'Answered':'Unanswered'}</span></div>${answerArea}${resolveRow}</article>`;
}

function openWorkstream(id){state.destination='workstream';state.workstreamId=id;state.childChat=null;state.menu='';state.overlay='';notice(`Opened Workstream brief: ${workstreams[id].title}.`)}
function openSession(id){const s=sessions[id];state.destination='workstream-session';state.workstreamId=s.workstreamId;state.sessionId=id;state.childChat=null;state.menu='';state.overlay='';notice(`Opened Workstream session: ${s.title}.`)}
function openChild(id){const c=subagents[id];state.destination='workstream-session';state.sessionId=c.session;state.workstreamId=sessions[c.session].workstreamId;state.childChat=id;state.menu='';state.overlay='';notice(`Inspecting child execution: ${c.title}.`)}
root.parentElement.addEventListener('click',onClick);
function onClick(e){
 const b=e.target.closest('button');const menuPanel=e.target.closest('[data-menu-panel]');
 if(state.menu&&!menuPanel&&!(b&&b.dataset.menuToggle))state.menu='';
 if(!b){render();return}
 const d=b.dataset;
 if(d.openChat){openStandalone(d.openChat);return render()}
 if(d.openWorkstream){openWorkstream(d.openWorkstream);return render()}
 if(d.openSession){openSession(d.openSession);return render()}
 if(d.child){openChild(d.child);return render()}
 if(d.childToggle){state.childOpen[d.childToggle]=!state.childOpen[d.childToggle];return render()}
 if(d.childClose!==undefined){state.childChat=null;notice('Returned to the session conversation.');return render()}
 if(d.openBrief!==undefined){state.destination='workstream';state.childChat=null;state.menu='';notice('Opened Workstream brief.');return render()}
 if(d.backRoot!==undefined){state.destination='standalone-chat';state.childChat=null;state.menu='';notice('Returned to all Chats and Workstreams.');return render()}
 if(d.openContext!==undefined){state.toolByScope[scopeKey()]='Context';notice('Context opened.');return render()}
 if(d.openTaskContext){const t=humanTasks[d.openTaskContext];openSession(t.source);state.toolByScope['session:'+t.source]='Context';notice(`Opened Context for ${sessions[t.source].title}.`);return render()}
 if(d.openSource){const t=humanTasks[d.openSource];openSession(t.source);notice(`Opened source conversation: ${sessions[t.source].title}.`);return render()}
 if(d.collapseNav!==undefined){state.navCollapsed=true;state.menu='';notice('Navigation collapsed to horizontal tabs.');return render()}
 if(d.expandNav!==undefined){state.navCollapsed=false;state.menu='';notice('Navigation expanded.');return render()}
 if(d.newSession!==undefined){notice('New session — prototype placeholder; no session was created.');return render()}
 if(d.tool){state.toolByScope[scopeKey()]=d.tool;state.childChat=null;notice(`${d.tool} opened for the selected session.`);return render()}
 if(d.folder){state.foldersOpen[d.folder]=!state.foldersOpen[d.folder];return render()}
 if(d.file){state.fileOpen=d.file;notice(`Opened ${d.file}.`);return render()}
 if(d.git){state.gitFile=d.git;return render()}
 if(d.terminalToggle!==undefined){state.terminal.open=!state.terminal.open;notice(state.terminal.open?'Terminal opened.':'Terminal closed.');return render()}
 if(d.terminalClose!==undefined){state.terminal.open=false;return render()}
 if(d.menuToggle){state.menu=state.menu===d.menuToggle?'':d.menuToggle;return render()}
 if(d.overlay){state.overlay=state.overlay===d.overlay?'':d.overlay;return render()}
 if(d.overlayClose!==undefined){state.overlay='';return render()}
 if(d.act){handleMenuAct(d.act);return render()}
 if(d.liveOption!==undefined){submitLive(d.liveOption);return render()}
 if(d.liveType!==undefined){const k=scopeKey();state.live[k].correcting=true;state.live[k].mode='text';return render()}
 if(d.liveSubmit!==undefined){const v=(document.querySelector('[data-live-draft]')?.value||'').trim();if(!v){notice('Enter an answer before sending.');return render()}submitLive(v);return render()}
 if(d.liveCorrect!==undefined){const k=scopeKey();state.live[k]={status:'pending',mode:currentEntity().decision.kind==='text'?'text':'choice',correcting:false,value:''};notice('Live decision reopened for correction.');return render()}
 if(d.taskAnswer){const[id,val]=d.taskAnswer.split('|');state.taskAnswers[id]=val;state.taskAnswerAt[id]='received just now';notice(`Human Task answered: ${val}.`);return render()}
 if(d.taskSubmit){const v=(document.querySelector(`[data-task-draft="${d.taskSubmit}"]`)?.value||'').trim();if(!v){notice('Enter an answer before sending.');return render()}state.taskAnswers[d.taskSubmit]=v;state.taskAnswerAt[d.taskSubmit]='received just now';notice('Human Task answered.');return render()}
 if(d.taskClear){delete state.taskAnswers[d.taskClear];delete state.taskAnswerAt[d.taskClear];state.taskResolved[d.taskClear]=false;notice('Human Task answer cleared.');return render()}
 if(d.taskResolve){state.taskResolved[d.taskResolve]=true;notice('Human Task resolved.');return render()}
 if(d.taskReopen){state.taskResolved[d.taskReopen]=false;notice('Human Task resolution reopened.');return render()}
 if(d.cancel){state.cancelState[d.cancel]='cancelling';render();setTimeout(()=>{state.cancelState[d.cancel]='cancelled';notice('Child execution cancelled.');render()},900);return}
 if(d.copy){navigator.clipboard?.writeText(d.copy);notice('Pi session ID copied.');return render()}
 if(d.promote!==undefined){state.dialog={type:'promote',title:standaloneChats[state.standaloneId].title};return render()}
 if(d.dialogCancel!==undefined){state.dialog=null;notice('Cancelled.');return render()}
 if(d.dialogConfirm!==undefined){confirmDialog();return render()}
 if(d.dialogFail!==undefined){failCheckpoint();return render()}
 if(d.send!==undefined){const inp=document.querySelector('input[aria-label="Message Pi"]');const v=(inp?.value||'').trim();if(!v){notice('Enter a message before sending.');return render()}const k=scopeKey();(state.sent[k]=state.sent[k]||[]).push(v);notice('Message added to the same conversation.');return render()}
 render();
}
function submitLive(value){const k=scopeKey();state.live[k]={status:'submitting',value,mode:currentEntity().decision.kind==='text'?'text':'choice',correcting:false};notice('Submitting live decision…');render();setTimeout(()=>{const cur=state.live[k];if(cur&&cur.status==='submitting'){state.live[k]={status:'answered',value,mode:cur.mode};notice(`Live decision answered: ${value}.`);render()}},500)}
function handleMenuAct(act){
 state.menu='';
 switch(act){
  case'palette':notice('Command palette (⌘K) — prototype placeholder.');break;
  case'projects':notice('Projects & checkouts — prototype placeholder.');break;
  case'auth':notice('Authentication — host-owned control.');break;
  case'recovery':notice('Recovery — host-owned control.');break;
  case'settings':notice('Settings — prototype placeholder.');break;
  case'theme':state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;localStorage.setItem('unified-prototype-theme',state.theme);notice(`GitHub ${state.theme==='dark'?'Dark':'Light'} applied.`);break;
  case'ws-rename':state.dialog={type:'rename',value:currentWorkstream().title};break;
  case'ws-link':state.dialog={type:'addlink',value:''};break;
  case'ws-close':currentWorkstream().closed=true;notice(`${currentWorkstream().title} marked closed.`);break;
  case'sess-anchor':notice(`Anchor: ${currentSession().anchor} · explicit selected-session checkout.`);break;
  case'sess-resume':notice(`Resumed session: ${currentSession().title}.`);break;
  case'sess-checkpoint':state.dialog={type:'checkpoint',sessionId:state.sessionId,draft:`Proposed: ${currentSession().summary.toLowerCase()}; confirm to update the latest checkpoint.`};break;
 }
}
function confirmDialog(){
 const d=state.dialog;if(!d)return;const val=document.querySelector('[data-dialog-input]')?.value.trim();
 if(d.type==='promote'){const c=standaloneChats[state.standaloneId];const title=val||c.title;const wsId='promoted-'+c.id,sId='s-'+c.id;
  workstreams[wsId]={id:wsId,title,revision:1,freshness:'Current · just created',fresh:'green',provenance:'Confirmed by owner · source: '+c.title,continuation:'Continue the promoted conversation as the first session.',changed:'Standalone Chat promoted into a Workstream.',remains:'Add durable context as work continues.',links:[c.anchor],closed:false,sessionIds:[sId],taskIds:[]};
  sessions[sId]={id:sId,workstreamId:wsId,title:c.title,anchor:c.anchor,summary:'Promoted from standalone Chat',update:'Conversation preserved from the standalone Chat.',updatedAt:'Just now',user:c.user,assistant:c.assistant,decision:c.decision};
  state.checkpoints[sId]={text:'Promoted from standalone Chat; no checkpoint confirmed yet.',at:'No confirmation yet'};
  const from='chat:'+c.id,to='session:'+sId;if(state.sent[from])state.sent[to]=state.sent[from].slice();if(state.live[from])state.live[to]=Object.assign({},state.live[from]);
  state.dialog=null;openSession(sId);notice('Workstream created around the existing Chat; the same conversation was preserved.');return;}
 if(d.type==='rename'){if(val)currentWorkstream().title=val;state.dialog=null;notice('Workstream renamed.');return}
 if(d.type==='addlink'){if(val)currentWorkstream().links.push(val);state.dialog=null;notice('Link added.');return}
 if(d.type==='checkpoint'){state.checkpoints[d.sessionId]={text:val||d.draft,at:'Confirmed just now'};state.checkpointFailure[d.sessionId]=false;state.dialog=null;notice('Checkpoint confirmed; latest checkpoint updated.');return}
}
function failCheckpoint(){const d=state.dialog;if(d&&d.type==='checkpoint'){state.checkpointFailure[d.sessionId]=true;state.dialog=null;notice('Checkpoint request failed; the previous confirmation is retained.')}}
/* ---------- resize (horizontal left + vertical terminal) ---------- */
root.parentElement.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-resize]');if(!handle||e.target.closest('button'))return;
 const kind=handle.dataset.resize;e.preventDefault();handle.classList.add('dragging');document.body.style.userSelect='none';
 const startX=e.clientX,startY=e.clientY,startW=state.panels.left.width,startH=state.terminal.height;
 const move=ev=>{if(kind==='left'){state.panels.left.width=Math.round(Math.max(220,Math.min(Math.min(520,innerWidth*.5),startW+(ev.clientX-startX))));bodyVars()}else if(kind==='term'){state.terminal.height=Math.round(Math.max(120,Math.min(innerHeight*.6,startH+(startY-ev.clientY))));const p=document.querySelector('.terminal-pane');if(p)p.style.height=state.terminal.height+'px'}};
 const finish=()=>{handle.classList.remove('dragging');document.body.style.userSelect='';removeEventListener('pointermove',move);removeEventListener('pointerup',finish);removeEventListener('pointercancel',finish)};
 addEventListener('pointermove',move);addEventListener('pointerup',finish);addEventListener('pointercancel',finish);
});
/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(state.dialog){state.dialog=null;render();return}if(state.menu){state.menu='';render();return}if(state.overlay){state.overlay='';render();return}if(state.childChat){state.childChat=null;render();return}}
 const ae=document.activeElement;
 if(e.key==='Enter'&&ae?.matches('input[aria-label="Message Pi"]')){document.querySelector('[data-send]')?.click();return}
 if(e.key==='Enter'&&ae?.matches('[data-dialog-input]')&&ae.tagName==='INPUT'){document.querySelector('[data-dialog-confirm]')?.click();return}
});
render();
</script>
