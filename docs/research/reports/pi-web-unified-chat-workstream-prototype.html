<title>PI WEB — Unified Chats + Workstreams Prototype</title>

.left-panel,.slot-left{grid-column:1}.left-resizer,.slot-lr{grid-column:2}.center{grid-column:3}.right-resizer,.slot-rr{grid-column:4}.right-panel,.slot-right{grid-column:5}
.panel{min-width:0;min-height:0;overflow:auto;background:var(--surface)}.left-panel{border-right:1px solid var(--border)}.right-panel{border-left:1px solid var(--border)}

.nav-list{display:grid;gap:2px;padding:0 8px}

.session-row:hover{background:var(--hover)}.session-row.selected{background:color-mix(in srgb,var(--accent) 16%,transparent)}

.workstream-strip button:hover{background:var(--hover)}.workstream-strip button.active{border-color:var(--border);background:var(--canvas);color:var(--bright);font-weight:650}
.workstream-strip .strip-id{font-weight:700;color:var(--bright);padding-inline:6px}
.chat{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--canvas)}

.composer input{min-width:0;border:0;outline:0;background:transparent;color:var(--bright);padding:5px}

.live-decision h3{font-size:14px;line-height:1.35}.live-decision p{margin:5px 0 10px;color:var(--muted);font-size:12px}
.ld-options{display:flex;flex-wrap:wrap;gap:6px}.ld-options button{padding:5px 10px}
.ld-correct{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:9px}
.ld-correct textarea,.ld-text textarea{width:100%;min-height:52px;resize:vertical;border:1px solid var(--border);border-radius:7px;background:var(--canvas);color:var(--bright);padding:8px}

.ld-linkbtn{border:0;background:transparent;color:var(--accent);padding:0}

.task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

/* ---------- state ---------- */
const state={
 destination:'standalone-chat', // standalone-chat | workstream | workstream-session
 standaloneId:'release',
 workstreamId:'admin',
 sessionId:'shape',
 toolByScope:{},
 navCollapsed:false,
 theme:localStorage.getItem('unified-prototype-theme')||'dark',
 panels:{left:{open:true,width:300},right:{open:true,width:360}},
 menu:'',          // pi | workstream | session
 dialog:null,      // {type, ...}
 overlay:'',       // narrow only: nav | ctx
 notice:'',
 sent:{},          // scopeKey -> [messages]
 live:{},          // scopeKey -> {status, mode, value, correcting}
 taskAnswers:{}, taskAnswerAt:{}, taskResolved:{},
 checkpoints:{
  shape:{text:'Unified shell mapped; navigation and active work read as one system.',at:'Confirmed 8 min ago'},
  contracts:{text:'Contract reconciliation paused pending the shell decision.',at:'Confirmed yesterday'},
  inspect:{text:'Host-owned controls and surface seams mapped.',at:'Confirmed 42 min ago'},
  modelcompare:{text:'High-effort lead binding favored by current evidence.',at:'Confirmed 6 min ago'}
 },
 checkpointFailure:{}
};
document.documentElement.dataset.theme=state.theme;
const root=document.querySelector('#root');
/* ---------- helpers ---------- */
function esc(v){const n=document.createElement('span');n.textContent=v==null?'':String(v);return n.innerHTML}
function wsMode(){return state.destination==='workstream'||state.destination==='workstream-session'}
function currentWorkstream(){return workstreams[state.workstreamId]}
function currentSession(){return sessions[state.sessionId]}
function scopeKey(){return state.destination==='standalone-chat'?'chat:'+state.standaloneId:'session:'+state.sessionId}
function currentEntity(){return state.destination==='standalone-chat'?standaloneChats[state.standaloneId]:currentSession()}
function toolsFor(){return state.destination==='standalone-chat'?['Files','Git','Terminal']:['Context','Files','Git','Terminal']}
function currentTool(){const k=scopeKey();const def=state.destination==='standalone-chat'?'Files':'Context';const t=state.toolByScope[k]||def;return toolsFor().includes(t)?t:def}
function pendingTasks(ws){return ws.taskIds.filter(id=>!state.taskResolved[id])}
function unansweredTasks(ws){return ws.taskIds.filter(id=>!state.taskAnswers[id])}
/* ---------- top bar + menus ---------- */
function topbar(){
 return `<header class="topbar">
  <button class="brand" data-menu-toggle="pi" aria-haspopup="true" aria-expanded="${state.menu==='pi'}" aria-label="PI WEB menu"><span class="pi-mark">π</span></button>
  <div class="scope"><strong>Chats + Workstreams</strong><span class="muted">one stable workspace</span></div>
  <div class="push"><span class="prototag">PROTOTYPE</span></div>
  <div class="narrow-only">
   <button class="icon" data-overlay="nav" aria-label="Open navigation">☰</button>
   <button class="icon ctx-toggle" data-overlay="ctx" aria-label="Open context and tools">◫</button>
  </div>
 </header>`;
}
function piMenu(){
 if(state.menu!=='pi')return'';
 return `<nav class="menu" data-menu-panel style="top:50px;left:12px;width:300px" aria-label="PI WEB menu">
  <div class="menu-head"><span class="pi-mark">π</span><span><strong>PI WEB</strong><small>Shell actions</small></span><span class="dot" title="Connected"></span></div>
  <button data-act="palette">Command palette<span class="kbd">⌘K</span></button>
  <button data-act="projects">Projects &amp; checkouts</button>
  <div class="sep"></div>
  <button data-act="auth">Authentication</button>
  <button data-act="recovery">Recovery</button>
  <div class="sep"></div>
  <button data-act="theme">Theme &amp; presentation<span class="kbd">${state.theme==='dark'?'Dark':'Light'}</span></button>
  <button data-act="settings">Settings</button>
 </nav>`;
}
function workstreamMenu(){
 if(state.menu!=='workstream')return'';
 const y=wsMode()&&!state.navCollapsed?116:96;
 return `<nav class="menu" data-menu-panel style="top:${y}px;left:${state.navCollapsed?12:220}px" aria-label="Workstream menu">
  <span class="menu-label">Workstream</span>
  <button data-act="ws-rename">Rename…</button>
  <button data-act="ws-link">Add link…</button>
  <div class="sep"></div>
  <button class="danger" data-act="ws-close">Close Workstream</button>
 </nav>`;
}
function sessionMenu(){
 if(state.menu!=='session')return'';
 return `<nav class="menu" data-menu-panel style="top:104px;right:16px" aria-label="Session menu">
  <span class="menu-label">Session</span>
  <button data-act="sess-anchor">Inspect anchor</button>
  <button data-act="sess-resume">Resume session</button>
  <div class="sep"></div>
  <button data-act="sess-checkpoint">Request checkpoint…</button>
 </nav>`;
}
/* ---------- left navigation ---------- */
function rootNav(){
 const chats=Object.values(standaloneChats).map(c=>`<button class="nav-row ${state.destination==='standalone-chat'&&state.standaloneId===c.id?'selected':''}" data-open-chat="${c.id}"><span class="dot" style="background:${state.standaloneId===c.id?'var(--green)':'var(--muted)'}"></span><span class="truncate">${esc(c.title)}<span class="meta">${esc(c.anchor)}</span></span><span class="muted">›</span></button>`).join('');
 const ws=Object.values(workstreams).map(w=>{const need=unansweredTasks(w).length;return `<button class="nav-row" data-open-workstream="${w.id}"><span class="muted">›</span><span class="truncate">${esc(w.title)}${w.closed?' <span class="badge">Closed</span>':''}<span class="meta">${w.sessionIds.length} session${w.sessionIds.length===1?'':'s'} · ${need?need+' need you':'no open tasks'}</span></span>${need?`<span class="badge orange">${need}</span>`:''}</button>`}).join('');
 return `<aside class="panel left-panel">
  <div class="section-title"><span>Chats</span><button class="icon" aria-label="New Chat">＋</button></div>
  <div class="nav-list">${chats}</div>
  <div class="section-title"><span>Workstreams</span><span>${Object.keys(workstreams).length}</span></div>
  <div class="nav-list">${ws}</div>
 </aside>`;
}
function workstreamNav(){
 const w=currentWorkstream();
 const rows=w.sessionIds.map(id=>{const s=sessions[id];return `<button class="session-row ${state.destination==='workstream-session'&&state.sessionId===id?'selected':''}" data-open-session="${id}"><span class="dot"></span><span><strong>${esc(s.title)}</strong><small>${esc(s.anchor)}</small><small>${esc(s.summary)}</small></span></button>`}).join('');
 return `<aside class="panel left-panel">
  <header class="ws-nav-head">
   <div class="ws-nav-head-top">
    <button class="icon" data-back-root aria-label="Back to all Chats and Workstreams">←</button>
    <button class="ws-identity ${state.destination==='workstream'?'selected':''}" data-open-brief aria-label="Open Workstream brief"><span class="truncate"><span class="label">Workstream</span><strong class="truncate">${esc(w.title)}</strong></span></button>
    <button class="icon" data-menu-toggle="workstream" aria-haspopup="true" aria-expanded="${state.menu==='workstream'}" aria-label="Workstream menu">···</button>
   </div>
   <div style="display:flex;gap:6px"><button class="small" data-collapse-nav aria-label="Collapse session navigation to horizontal tabs">⇤ Collapse</button></div>
  </header>
  <div class="section-title"><span>Sessions · ${w.sessionIds.length}</span><button class="icon" data-new-session aria-label="New session">＋</button></div>
  <div>${rows}</div>
 </aside>`;
}
function leftPane(){return wsMode()?workstreamNav():rootNav()}
/* ---------- workstream strip (collapsed navigation) ---------- */
function workstreamStrip(){
 const w=currentWorkstream();
 const tabs=w.sessionIds.map(id=>`<button class="${state.destination==='workstream-session'&&state.sessionId===id?'active':''}" data-open-session="${id}">${esc(sessions[id].title)}</button>`).join('');
 return `<nav class="workstream-strip" aria-label="Workstream sessions">
  <button class="icon" data-expand-nav aria-label="Expand session navigation vertically">⇥</button>
  <button class="strip-id" data-open-brief>${esc(w.title)}</button>
  <button class="${state.destination==='workstream'?'active':''}" data-open-brief>Brief</button>
  <span style="width:1px;height:22px;background:var(--border);flex:0 0 auto"></span>
  ${tabs}
  <button class="icon" data-new-session aria-label="New session">＋</button>
  <span style="flex:1"></span>
  <button class="icon" data-menu-toggle="workstream" aria-label="Workstream menu">···</button>
 </nav>`;
}
/* ---------- conversation + live decision ---------- */
function liveDecisionCard(){
 const e=currentEntity(),d=e.decision,key=scopeKey();
 if(!d)return'';
 const st=state.live[key]||{status:'pending',mode:d.kind==='text'?'text':'choice',correcting:false,value:''};
 state.live[key]=st;
 let inner;
 if(st.status==='submitting'){
  inner=`<div class="ld-status"><span class="dot" style="background:var(--orange)"></span>Submitting your answer…</div>`;
 }else if(st.status==='answered'){
  inner=`<div class="ld-outcome"><span>Answered · <strong>${esc(st.value)}</strong> · sent to the live session</span><button class="ld-linkbtn" data-live-correct>Correct</button></div>`;
 }else if(st.mode==='text'||st.correcting){
  inner=`<div class="${st.correcting?'ld-correct':'ld-text'}"><textarea data-live-draft placeholder="Type your answer…">${esc(st.value||'')}</textarea><button class="primary" data-live-submit>Send</button></div>`;
 }else{
  inner=`<div class="ld-options">${d.options.map(o=>`<button data-live-option="${esc(o)}">${esc(o)}</button>`).join('')}</div><button class="ld-linkbtn" data-live-type style="margin-top:8px">Write a different answer</button>`;
 }
 return `<div class="live-decision"><div class="ld-tag"><span class="dot" style="background:var(--accent)"></span>Live decision · needs you now</div><h3>${esc(d.prompt)}</h3><p>${esc(d.detail)}</p>${inner}</div>`;
}
function conversation(){
 const e=currentEntity(),key=scopeKey();
 const sent=(state.sent[key]||[]).map(m=>`<div class="exchange"><div class="message-meta"><span class="role">USER</span><span>just now</span></div><div class="message-copy">${esc(m)}</div></div>`).join('');
 return `<div class="messages">
  <div class="exchange"><div class="message-meta"><span class="role">USER</span><span>10:52 AM</span></div><div class="message-copy">${esc(e.user)}</div><div class="event-fold">▸ Events · 4 events · 1 assistant · 3 tool</div></div>
  <div class="exchange assistant"><div class="message-meta"><span class="role">ASSISTANT</span><span>openai-codex/gpt-5.6-sol · medium</span></div><div class="message-copy">${esc(e.assistant)}</div></div>
  ${sent}
  ${liveDecisionCard()}
 </div>`;
}
function chatHead(){
 const e=currentEntity();
 if(state.destination==='standalone-chat'){
  return `<header class="chat-head"><div class="chat-title"><h1>${esc(e.title)}</h1><div class="crumbs"><span class="badge">Standalone Chat</span> · ${esc(e.anchor)}</div></div><div class="chat-actions"><button class="primary" data-promote>Promote to Workstream</button></div></header>`;
 }
 const w=currentWorkstream(),need=unansweredTasks(w).length;
 return `<header class="chat-head"><div class="chat-title"><h1>${esc(e.title)}</h1><div class="crumbs"><span class="badge green">Workstream</span> · ${esc(w.title)} · ${esc(e.anchor)}</div></div><div class="chat-actions">${need?`<button data-open-context>Needs you · ${need}</button>`:''}<button data-menu-toggle="session" aria-haspopup="true" aria-expanded="${state.menu==='session'}" aria-label="Session menu">···</button></div></header>`;
}
function chatSurface(){
 return `<main class="chat">${chatHead()}${conversation()}<div class="composer"><div class="composer-box"><input aria-label="Message Pi" placeholder="Message Pi… Use / for commands, @ for files"><button class="primary" data-send>Send</button></div><div class="composer-meta"><span>openai-codex/gpt-5.6-sol</span><span>↑148k · ↓24k · $3.87</span></div></div></main>`;
}
/* ---------- Workstream brief (middle) ---------- */
function briefSurface(){
 const w=currentWorkstream();
 const unresolved=pendingTasks(w);
 const tasks=unresolved.length?unresolved.map(id=>{const t=humanTasks[id],answered=state.taskAnswers[id];return `<div class="brief-task"><strong>${esc(t.title)}</strong><span class="badge ${answered?'green':'orange'}">${answered?'Answered':'Unanswered'}</span><div class="sub"><small>From ${esc(sessions[t.source].title)}</small><span class="badge">${esc(t.materiality)}</span><button class="ctx-link" data-open-task-context="${id}">Answer in Context ›</button></div></div>`}).join(''):`<p class="muted">No unresolved Human Tasks.</p>`;
 const updates=w.sessionIds.map(id=>{const s=sessions[id];return `<div class="brief-update"><strong>${esc(s.title)}</strong><span>${esc(s.update)}</span><small>${esc(s.updatedAt)}</small></div>`}).join('');
 const index=w.sessionIds.map(id=>{const s=sessions[id];return `<button class="index-row" data-open-session="${id}"><span><strong>${esc(s.title)}</strong><br><small>${esc(s.summary)}</small></span><span>${esc(s.update)}</span><small>${esc(s.anchor)}</small><span class="open">Open conversation</span></button>`}).join('');
 return `<main class="brief" aria-label="Workstream brief">
  <div class="brief-head">
   <div><span class="badge ${w.fresh}">${esc(w.freshness)}</span><h1>${esc(w.title)}</h1><div class="brief-meta">Workstream brief · revision ${w.revision} · ${w.sessionIds.length} session${w.sessionIds.length===1?'':'s'} · ${esc(w.provenance)}</div></div>
   <div class="brief-actions"><button data-menu-toggle="workstream" aria-label="Workstream menu">···</button><button class="primary" data-open-session="${w.sessionIds[0]}">Continue in session</button></div>
  </div>
  <div class="brief-grid">
   <section class="brief-section"><h2>Next useful continuation</h2><p class="continuation">${esc(w.continuation)}</p>
    <dl class="brief-facts"><dt>What changed</dt><dd>${esc(w.changed)}</dd><dt>What remains</dt><dd>${esc(w.remains)}</dd><dt>Freshness</dt><dd>${esc(w.freshness)}</dd><dt>Provenance</dt><dd>${esc(w.provenance)}</dd></dl>
   </section>
   <section class="brief-section"><h2>Unresolved Human Tasks · ${unresolved.length}</h2>${tasks}<p class="muted" style="margin-top:10px;font-size:11px">Answer and resolve durable Human Tasks in a session's Context tab.</p></section>
  </div>
  <section class="brief-updates"><h2 class="brief-section" style="border:0;padding:0">Latest confirmed session updates</h2>${updates}</section>
  <section class="session-index"><h2 class="brief-section" style="border:0;padding:0">Session index</h2>${index}</section>
 </main>`;
}
/* ---------- middle pane ---------- */
function middlePane(){
 const strip=(wsMode()&&state.navCollapsed)?workstreamStrip():'';
 const surface=state.destination==='workstream'?briefSurface():chatSurface();
 return `<section class="center">${strip?`<div>${strip}</div>`:'<div style="display:none"></div>'}${surface}</section>`;
}
/* ---------- right pane: Context + tools ---------- */
function toolTabs(){
 const tabs=toolsFor();const cur=currentTool();
 return `<div class="tool-tabs">${tabs.map(t=>`<button class="${cur===t?'active':''}" data-tool="${t}">${t}</button>`).join('')}</div>`;
}
function durableTaskCard(id){
 const t=humanTasks[id],answer=state.taskAnswers[id],resolved=state.taskResolved[id];
 let answerArea;
 if(answer){
  answerArea=`<div class="task-answered"><span>Answered: <strong>${esc(answer)}</strong> · ${esc(state.taskAnswerAt[id]||'just now')}</span><button class="task-open" data-task-clear="${id}">Change</button></div>`;
 }else if(t.kind==='text'){
  answerArea=`<div class="task-text"><textarea data-task-draft="${id}" placeholder="Type your answer…"></textarea><button class="primary" data-task-submit="${id}">Send</button></div>`;
 }else{
  answerArea=`<div class="task-answers">${t.options.map(o=>`<button data-task-answer="${id}|${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
 }
 const resolveRow=answer?`<div class="task-resolve"><span class="badge ${resolved?'green':'orange'}">${resolved?'Resolved':'Open · awaiting resolution'}</span>${resolved?`<button class="task-open" data-task-reopen="${id}">Reopen</button>`:`<button class="small" data-task-resolve="${id}">Resolve</button>`}</div>`:'';
 return `<article class="task-card"><div class="task-top"><h3>${esc(t.title)}</h3><span class="badge ${t.materiality.startsWith('High')?'red':t.materiality.startsWith('Medium')?'orange':''}">${esc(t.materiality.split(' · ')[0])}</span></div><p>${esc(t.detail)}</p><div class="task-prov">Source: <button class="task-open" data-open-source="${id}">${esc(sessions[t.source].title)}</button> · <span class="badge ${answer?'green':''}">${answer?'Answered':'Unanswered'}</span></div>${answerArea}${resolveRow}</article>`;
}
function contextTab(){
 const w=currentWorkstream(),s=currentSession(),cp=state.checkpoints[s.id],failed=state.checkpointFailure[s.id];
 const tasks=w.taskIds.map(durableTaskCard).join('');
 return `<div class="panel-section"><span class="label">Workstream brief · revision ${w.revision}</span><p class="continuation" style="font-size:14px">${esc(w.continuation)}</p><button class="ctx-link" data-open-brief>Open full Workstream brief ›</button></div>
  <div class="panel-section"><span class="label">Durable Human Tasks · ${w.taskIds.length}</span>${tasks}</div>
  <div class="panel-section"><span class="label">Selected-session checkpoint</span><div class="checkpoint-box"><span class="badge ${failed?'red':'green'}">${failed?'Last request failed · previous confirmation retained':'Latest confirmed'}</span><p>${esc(cp.text)}</p><small class="muted">${esc(cp.at)}</small></div></div>
  <div class="panel-section"><span class="label">Links</span>${w.links.map(l=>`<div class="file-row"><span class="badge">🔗</span><span>${esc(l)}</span></div>`).join('')}</div>
  <div class="panel-section"><span class="label">Session anchor</span><p>${esc(s.anchor)}</p><small class="muted">Explicit selected-session checkout</small></div>`;
}
function toolContent(){
 const tool=currentTool(),e=currentEntity();
 if(tool==='Context')return contextTab();
 if(tool==='Files')return `<div class="panel-section"><span class="label">Checkout files · ${esc(e.anchor)}</span><div class="file-row">▸ <span>.github</span></div><div class="file-row">▸ <span>packages/</span></div><div class="file-row">▸ <span>README.md</span></div></div>`;
 if(tool==='Git')return `<div class="panel-section"><span class="label">Repository state</span><h3>${esc(e.anchor)}</h3><p class="muted">clean · ahead 0 · behind 0</p><div class="file-row"><span class="badge green">2 linked PRs</span></div></div>`;
 return `<div class="panel-section"><span class="label">Terminal · ${esc(e.anchor)}</span><div class="terminal-mini">$ git status --short<br><span class="muted"># working tree clean</span><br>$ gh pr status</div></div>`;
}
function rightPane(){return `<aside class="panel right-panel">${toolTabs()}${toolContent()}</aside>`}
/* ---------- resizers ---------- */
function leftResizer(){const open=!wsMode()?state.panels.left.open:true;const arrow=open?'‹':'›';return `<div class="resizer left-resizer" data-resize="left"><button data-toggle-panel="left" aria-label="Resize or collapse navigation" title="Drag to resize">${arrow}</button></div>`}
function rightResizer(){const open=state.panels.right.open;return `<div class="resizer right-resizer" data-resize="right"><button data-toggle-panel="right" aria-label="Resize or collapse context" title="Drag to resize">${open?'›':'‹'}</button></div>`}
/* ---------- dialogs ---------- */
function dialogView(){
 const d=state.dialog;if(!d)return'';
 let body;
 if(d.type==='promote'){const c=standaloneChats[state.standaloneId];body=`<span class="badge orange">Durable context</span><h2>Promote this Chat to a Workstream</h2><p>The current conversation stays in place and becomes the Workstream's first session.</p><label>Workstream title<input value="${esc(d.title)}" data-dialog-input aria-label="Workstream title"></label><div class="dialog-facts"><span>Chat · ${esc(c.title)}</span><span>Checkout · ${esc(c.anchor)}</span><span>Association · permanent in this prototype</span></div><div class="actions"><button data-dialog-cancel>Cancel</button><button class="primary" data-dialog-confirm>Create Workstream</button></div>`;}
 else if(d.type==='rename'){body=`<h2>Rename Workstream</h2><p>Update the Workstream title in prototype memory.</p><label>Title<input value="${esc(d.value)}" data-dialog-input aria-label="Workstream title"></label><div class="actions"><button data-dialog-cancel>Cancel</button><button class="primary" data-dialog-confirm>Rename</button></div>`;}
 else if(d.type==='addlink'){body=`<h2>Add link</h2><p>Attach a reference link to this Workstream.</p><label>Link<input value="${esc(d.value)}" data-dialog-input placeholder="owner/repo#123 or URL" aria-label="Link"></label><div class="actions"><button data-dialog-cancel>Cancel</button><button class="primary" data-dialog-confirm>Add link</button></div>`;}
 else if(d.type==='checkpoint'){const s=sessions[d.sessionId];body=`<span class="badge">Attended</span><h2>Request checkpoint · ${esc(s.title)}</h2><p>Pi proposes a checkpoint. Correct the text if needed, then confirm. Only confirmation changes the displayed latest checkpoint.</p><label>Proposed checkpoint<textarea data-dialog-input aria-label="Proposed checkpoint">${esc(d.draft)}</textarea></label><div class="actions"><button data-dialog-cancel>Cancel</button><button data-dialog-fail>Confirm (simulate failure)</button><button class="primary" data-dialog-confirm>Confirm checkpoint</button></div>`;}
 return `<div class="backdrop" data-dialog-backdrop><section class="dialog" role="dialog" aria-modal="true">${body}</section></div>`;
}
/* ---------- narrow overlays ---------- */
function overlayView(){
 if(!state.overlay)return'';
 const side=state.overlay==='nav'?'left':'right';
 const content=state.overlay==='nav'?leftPane():(state.destination==='workstream'?'<div class="panel-section muted">Open a session to see Context and tools.</div>':rightPane());
 return `<aside class="overlay-pane ${side}"><div class="overlay-head"><strong>${state.overlay==='nav'?'Navigate':'Context &amp; tools'}</strong><button class="icon" data-overlay-close aria-label="Close">×</button></div>${content}</aside>`;
}
/* ---------- render ---------- */
function bodyVars(){
 const leftVisible=wsMode()?!state.navCollapsed:state.panels.left.open;
 const lw=leftVisible?state.panels.left.width:0;
 const rightUsed=state.destination!=='workstream';
 const rw=rightUsed&&state.panels.right.open?state.panels.right.width:0;
 const el=document.documentElement;
 el.style.setProperty('--lw',lw+'px');
 el.style.setProperty('--lr',(wsMode()&&state.navCollapsed)?'0px':'4px');
 el.style.setProperty('--rw',rw+'px');
 el.style.setProperty('--rr',rightUsed?'4px':'0px');
 return{leftVisible,rightUsed};
}
function render(){
 const{leftVisible,rightUsed}=bodyVars();
 const collapsedNav=wsMode()&&state.navCollapsed;
 const leftEl=leftVisible?leftPane():'<div class="slot-left"></div>';
 const leftRz=collapsedNav?'<div class="slot-lr"></div>':leftResizer();
 const rightOpen=rightUsed&&state.panels.right.open;
 const rightRz=rightUsed?rightResizer():'<div class="slot-rr"></div>';
 const rightEl=rightOpen?rightPane():'<div class="slot-right"></div>';
 root.innerHTML=`<div class="app" ${state.dialog?'inert':''}>
  ${topbar()}
  <div class="body">${leftEl}${leftRz}${middlePane()}${rightRz}${rightEl}</div>
 </div>
 ${piMenu()}${workstreamMenu()}${sessionMenu()}
 ${overlayView()}
 ${dialogView()}
 ${state.notice?`<div class="toast" role="status">${esc(state.notice)}</div>`:''}`;
 if(state.dialog)queueMicrotask(()=>document.querySelector('[data-dialog-input]')?.focus());
}
/* ---------- interactions ---------- */
function notice(t){state.notice=t}
function openStandalone(id){state.destination='standalone-chat';state.standaloneId=id;state.menu='';state.overlay='';notice(`Opened standalone Chat: ${standaloneChats[id].title}.`)}
function openWorkstream(id){state.destination='workstream';state.workstreamId=id;state.menu='';state.overlay='';notice(`Opened Workstream brief: ${workstreams[id].title}.`)}
function openSession(id){const s=sessions[id];state.destination='workstream-session';state.workstreamId=s.workstreamId;state.sessionId=id;state.menu='';state.overlay='';notice(`Opened Workstream session: ${s.title}.`)}
root.parentElement.addEventListener('click',onClick);
function onClick(e){
 const b=e.target.closest('button');
 const menuPanel=e.target.closest('[data-menu-panel]');
 // close menus when clicking outside a menu and outside a menu toggle
 if(state.menu&&!menuPanel&&!(b&&b.dataset.menuToggle)){state.menu='';}
 if(!b){if(state.menu===''){render()}return}
 const d=b.dataset;
 // navigation
 if(d.openChat){openStandalone(d.openChat);return render()}
 if(d.openWorkstream){openWorkstream(d.openWorkstream);return render()}
 if(d.openSession){openSession(d.openSession);return render()}
 if(d.openBrief!==undefined){state.destination='workstream';state.menu='';notice('Opened Workstream brief.');return render()}
 if(d.backRoot!==undefined){state.destination='standalone-chat';state.menu='';notice('Returned to all Chats and Workstreams.');return render()}
 if(d.openContext!==undefined){state.toolByScope[scopeKey()]='Context';state.overlay=matchMedia('(max-width:1040px)').matches?'ctx':'';notice('Context opened.');return render()}
 if(d.openTaskContext){const t=humanTasks[d.openTaskContext];openSession(t.source);state.toolByScope['session:'+t.source]='Context';notice(`Opened Context for ${sessions[t.source].title}.`);return render()}
 if(d.openSource){const t=humanTasks[d.openSource];openSession(t.source);notice(`Opened source conversation: ${sessions[t.source].title}.`);return render()}
 // nav collapse / expand
 if(d.collapseNav!==undefined){state.navCollapsed=true;state.menu='';notice('Session navigation collapsed to horizontal tabs.');return render()}
 if(d.expandNav!==undefined){state.navCollapsed=false;state.menu='';notice('Session navigation expanded.');return render()}
 if(d.newSession!==undefined){notice('New session — prototype placeholder; no session was created.');return render()}
 // tools
 if(d.tool){state.toolByScope[scopeKey()]=d.tool;notice(`${d.tool} opened for the selected session.`);return render()}
 // menus
 if(d.menuToggle){state.menu=state.menu===d.menuToggle?'':d.menuToggle;return render()}
 if(d.overlay){state.overlay=state.overlay===d.overlay?'':d.overlay;return render()}
 if(d.overlayClose!==undefined){state.overlay='';return render()}
 if(d.togglePanel){const side=d.togglePanel;if(wsMode()&&side==='left'){state.navCollapsed=!state.navCollapsed}else{state.panels[side].open=!state.panels[side].open}notice(`${side[0].toUpperCase()+side.slice(1)} panel ${((wsMode()&&side==='left')?!state.navCollapsed:state.panels[side].open)?'expanded':'collapsed'}.`);return render()}
 // PI WEB menu actions
 if(d.act){handleMenuAct(d.act);return render()}
 // live decision
 if(d.liveOption!==undefined){submitLive(d.liveOption);return render()}
 if(d.liveType!==undefined){const k=scopeKey();state.live[k].correcting=true;state.live[k].mode='text';return render()}
 if(d.liveSubmit!==undefined){const ta=document.querySelector('[data-live-draft]');const v=(ta?.value||'').trim();if(!v){notice('Enter an answer before sending.');return render()}submitLive(v);return render()}
 if(d.liveCorrect!==undefined){const k=scopeKey();state.live[k]={status:'pending',mode:currentEntity().decision.kind==='text'?'text':'choice',correcting:false,value:''};notice('Live decision reopened for correction.');return render()}
 // durable tasks
 if(d.taskAnswer){const[id,val]=d.taskAnswer.split('|');state.taskAnswers[id]=val;state.taskAnswerAt[id]='received just now';notice(`Human Task answered: ${val}.`);return render()}
 if(d.taskSubmit){const ta=document.querySelector(`[data-task-draft="${d.taskSubmit}"]`);const v=(ta?.value||'').trim();if(!v){notice('Enter an answer before sending.');return render()}state.taskAnswers[d.taskSubmit]=v;state.taskAnswerAt[d.taskSubmit]='received just now';notice('Human Task answered.');return render()}
 if(d.taskClear){delete state.taskAnswers[d.taskClear];delete state.taskAnswerAt[d.taskClear];state.taskResolved[d.taskClear]=false;notice('Human Task answer cleared.');return render()}
 if(d.taskResolve){state.taskResolved[d.taskResolve]=true;notice('Human Task resolved.');return render()}
 if(d.taskReopen){state.taskResolved[d.taskReopen]=false;notice('Human Task resolution reopened.');return render()}
 // promotion
 if(d.promote!==undefined){state.dialog={type:'promote',title:standaloneChats[state.standaloneId].title};return render()}
 // dialog
 if(d.dialogCancel!==undefined){state.dialog=null;notice('Cancelled.');return render()}
 if(d.dialogConfirm!==undefined){confirmDialog();return render()}
 if(d.dialogFail!==undefined){failCheckpoint();return render()}
 if(d.send!==undefined){const inp=document.querySelector('input[aria-label="Message Pi"]');const v=(inp?.value||'').trim();if(!v){notice('Enter a message before sending.');return render()}const k=scopeKey();(state.sent[k]=state.sent[k]||[]).push(v);notice('Message added to the same conversation.');return render()}
 render();
}
function submitLive(value){
 const k=scopeKey();state.live[k]={status:'submitting',value,mode:currentEntity().decision.kind==='text'?'text':'choice',correcting:false};
 notice('Submitting live decision…');render();
 setTimeout(()=>{const cur=state.live[k];if(cur&&cur.status==='submitting'){state.live[k]={status:'answered',value,mode:cur.mode};notice(`Live decision answered: ${value}.`);render()}},500);
}
function handleMenuAct(act){
 state.menu='';
 switch(act){
  case'palette':notice('Command palette (⌘K) — prototype placeholder.');break;
  case'projects':notice('Projects & checkouts — prototype placeholder.');break;
  case'auth':notice('Authentication — host-owned control.');break;
  case'recovery':notice('Recovery — host-owned control.');break;
  case'settings':notice('Settings — prototype placeholder.');break;
  case'theme':state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;localStorage.setItem('unified-prototype-theme',state.theme);notice(`GitHub ${state.theme==='dark'?'Dark':'Light'} applied.`);break;
  case'ws-rename':state.dialog={type:'rename',value:currentWorkstream().title};break;
  case'ws-link':state.dialog={type:'addlink',value:''};break;
  case'ws-close':currentWorkstream().closed=true;notice(`${currentWorkstream().title} marked closed.`);break;
  case'sess-anchor':notice(`Anchor: ${currentSession().anchor} · explicit selected-session checkout.`);break;
  case'sess-resume':notice(`Resumed session: ${currentSession().title}.`);break;
  case'sess-checkpoint':state.dialog={type:'checkpoint',sessionId:state.sessionId,draft:`Proposed: ${currentSession().summary.toLowerCase()}; confirm to update the latest checkpoint.`};break;
 }
}
function confirmDialog(){
 const d=state.dialog;if(!d)return;
 const val=document.querySelector('[data-dialog-input]')?.value.trim();
 if(d.type==='promote'){
  const c=standaloneChats[state.standaloneId];const title=val||c.title;
  const wsId='promoted-'+c.id, sId='s-'+c.id;
  workstreams[wsId]={id:wsId,title,revision:1,freshness:'Current · just created',fresh:'green',provenance:'Confirmed by owner · source: '+c.title,continuation:'Continue the promoted conversation as the first session.',changed:'Standalone Chat promoted into a Workstream.',remains:'Add durable context as work continues.',links:[c.anchor],closed:false,sessionIds:[sId],taskIds:[]};
  sessions[sId]={id:sId,workstreamId:wsId,title:c.title,anchor:c.anchor,summary:'Promoted from standalone Chat',update:'Conversation preserved from the standalone Chat.',updatedAt:'Just now',user:c.user,assistant:c.assistant,decision:c.decision};
  state.checkpoints[sId]={text:'Promoted from standalone Chat; no checkpoint confirmed yet.',at:'No confirmation yet'};
  // preserve conversation state across the promotion
  const from='chat:'+c.id, to='session:'+sId;
  if(state.sent[from])state.sent[to]=state.sent[from].slice();
  if(state.live[from])state.live[to]=Object.assign({},state.live[from]);
  state.dialog=null;openSession(sId);notice('Workstream created around the existing Chat; the same conversation was preserved.');return;
 }
 if(d.type==='rename'){if(val)currentWorkstream().title=val;state.dialog=null;notice('Workstream renamed.');return}
 if(d.type==='addlink'){if(val)currentWorkstream().links.push(val);state.dialog=null;notice('Link added.');return}
 if(d.type==='checkpoint'){const text=val||d.draft;state.checkpoints[d.sessionId]={text,at:'Confirmed just now'};state.checkpointFailure[d.sessionId]=false;state.dialog=null;notice('Checkpoint confirmed; latest checkpoint updated.');return}
}
function failCheckpoint(){const d=state.dialog;if(d&&d.type==='checkpoint'){state.checkpointFailure[d.sessionId]=true;state.dialog=null;notice('Checkpoint request failed; the previous confirmation is retained.')}}
/* ---------- resize ---------- */
root.parentElement.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-resize]');if(!handle||e.target.closest('button'))return;
 const side=handle.dataset.resize,panel=state.panels[side];
 if(side==='left'&&wsMode()&&state.navCollapsed)return;
 e.preventDefault();handle.classList.add('dragging');
 const startX=e.clientX,startWidth=panel.width;document.body.style.userSelect='none';
 const move=ev=>{const delta=side==='left'?ev.clientX-startX:startX-ev.clientX;panel.width=Math.round(Math.max(200,Math.min(Math.min(560,innerWidth*.5),startWidth+delta)));bodyVars()};
 const finish=()=>{handle.classList.remove('dragging');document.body.style.userSelect='';removeEventListener('pointermove',move);removeEventListener('pointerup',finish);removeEventListener('pointercancel',finish)};
 addEventListener('pointermove',move);addEventListener('pointerup',finish);addEventListener('pointercancel',finish);
});
/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(state.dialog){state.dialog=null;render();return}if(state.menu){state.menu='';render();return}if(state.overlay){state.overlay='';render();return}}
 const ae=document.activeElement;
 if(e.key==='Enter'&&ae?.matches('input[aria-label="Message Pi"]')){document.querySelector('[data-send]')?.click();return}
 if(e.key==='Enter'&&ae?.matches('[data-dialog-input]')&&ae.tagName==='INPUT'){document.querySelector('[data-dialog-confirm]')?.click();return}
});
render();
</script>
