<title>PROTOTYPE — PI WEB structural models</title>
<!-- PROTOTYPE — throwaway desktop interaction study, not production UI.
QUESTION: How should Workstreams, conversations, tools, and answerable Human Tasks fit together?
TRUTH: Workstreams restore attention; sessions own Chat and explicit checkout anchors; canonical state is never inferred from transcript UI.
SELECTED MODEL: Workbench hierarchy with collapsible session navigation, a top brief drawer, and answerable Human Tasks.
ANSWER TYPES: Human Tasks demonstrate Yes, No, Change, choice, and free-text answers with source-session provenance.
VISUALS: Intentionally neutral. This artifact evaluates information architecture and interaction, not branding.
-->

function piMenu(){return state.shellMenu?`<nav class="shell-menu pi-menu" aria-label="PI WEB navigation"><header class="pi-menu-head"><i>π</i><span><strong>PI WEB</strong><small>Workbench navigation</small></span><span class="pi-status-dot" title="Connected"></span></header><div class="pi-menu-section"><button class="pi-home" data-route="portfolio">Return to work <span style="float:right;color:var(--muted)">⌂</span></button></div><div class="pi-menu-section"><span class="pi-menu-label">Workstreams</span>${workstreams.map((w,i)=>`<button class="pi-menu-workstream ${i===0&&state.route==='session'?'current':''}" data-workstream="${w.id}"><span class="ws-copy"><strong>${w.title}</strong><small>${w.next}</small></span><span class="badge ${w.tasks?'warn':''}">${w.tasks||'—'}</span></button>`).join('')}</div><div class="pi-menu-section pi-menu-grid"><button>Actions <span style="float:right;color:var(--muted)">⌘K</span></button><button>Projects</button><button>Authentication</button><button>Recovery</button><button class="wide">Settings</button></div></nav>`:''}function shellMenu(){return `<div class="shell-menu-wrap"><button class="btn icon" data-toggle-shell-menu aria-label="PI WEB menu" aria-expanded="${state.shellMenu}">•••</button>${state.shellMenu?`<nav class="shell-menu" aria-label="PI WEB controls"><span class="menu-status">Connected</span><button>Actions <span style="float:right;color:var(--muted)">⌘K</span></button><button>Authentication</button><button>Recovery</button><button>Settings</button></nav>`:''}</div>`}function global(){if(state.model==='brief'){const inWork=state.route==='session';return `<header class="global operating-bar"><button class="brand" data-toggle-shell-menu aria-label="Open PI WEB navigation" aria-expanded="${state.shellMenu}"><i>π</i></button>${piMenu()}${inWork?`<strong>Redesign PI WEB</strong><button class="btn icon small brief-toggle ${state.briefDrawer?'on':''}" data-toggle-brief aria-label="${state.briefDrawer?'Close Workstream brief':'Open Workstream brief'}" title="${state.briefDrawer?'Close Workstream brief':'Open Workstream brief'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="M4 10h16"></path><path d="M8 14h8M8 17h5"></path></svg></button><span class="bar-divider"></span>${state.sessionsExpanded?`<strong style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(sessions.find(s=>s.id===state.session)||sessions[0]).title}</strong><span style="flex:1"></span>`:`<button class="btn icon small" data-toggle-session-layout aria-label="Expand session navigation" title="Expand sessions vertically">⇥</button><nav class="operating-sessions" aria-label="Workstream sessions">${sessions.map(s=>`<button class="session-tab ${state.session===s.id?'on':''}" data-session="${s.id}">${s.title}${s.delegations.some(d=>d.status==='active')?` <span class="child-badge" title="Active delegation">${s.delegations.filter(d=>d.status==='active').length}</span>`:''}</button>`).join('')}</nav><button class="btn icon small" aria-label="New session" title="New session">＋</button>`}<button class="btn small ${state.tray?'primary':''}" data-toggle-tray>Needs you · ${questions.filter(q=>!state.answers[q.id]).length}</button>`:`<strong>${state.route==='portfolio'?'Return to work':'Redesign PI WEB'}</strong><span style="flex:1"></span>`}</header>`}const route=state.route==='portfolio'?'Return':state.route==='brief'?'Redesign PI WEB':state.route==='session'?'Shape overall PI WEB':'Needs you';return `<header class="global"><button class="brand" data-route="portfolio"><i>π</i>PI WEB</button><div class="crumbs"><span>›</span><strong>${route}</strong>${state.route==='session'?'<span>› pi-workbench · workstreams-ui</span>':''}</div><div class="global-actions"><button class="btn quiet small">⌘K Actions</button>${shellMenu()}</div></header>`}
function portfolio(){return `<main class="portfolio"><div class="portfolio-head"><div><span class="badge good">Return brief · since yesterday 16:40</span><h1 style="margin-top:9px">Return to work</h1><p>See what changed across Workstreams before entering live session work. Conversation history stays available, but does not decide what is current.</p></div><button class="btn primary">New Workstream</button></div><section class="ws-table">${workstreams.map(w=>`<button class="ws-row" data-workstream="${w.id}"><span><strong>${w.title}</strong><br><span class="badge ${w.status.includes('Current')?'good':'warn'}">${w.status}</span></span><span><span class="label">Next useful continuation</span><span class="continuation">${w.next}</span></span><span><span class="label">Anchors</span>${w.anchor}</span><span><span class="label">Needs you</span><strong class="count">${w.tasks}</strong> tasks</span></button>`).join('')}</section><details class="closed"><summary>Closed Workstreams · 4</summary></details></main>`}
function questionCard(q,compact=false){const answer=state.answers[q.id];return `<article class="question ${state.selectedTask===q.id?'selected':''}" data-select-task="${q.id}"><header class="question-head"><div><strong>${q.title}</strong><p>${q.detail}</p></div><span class="q-source">${q.source}</span></header>${answer?`<div class="answered"><span>Answered: <strong>${escape(answer)}</strong></span><button data-edit-answer="${q.id}">Change answer</button></div>`:`<div class="answer-area">${q.kind==='text'?`<div class="free-answer"><textarea data-draft="${q.id}" placeholder="Type your answer…">${escape(state.drafts[q.id]||'')}</textarea><button class="btn primary" data-submit-text="${q.id}">Send</button></div>`:`<div class="quick-answers">${q.options.map(o=>`<button class="answer" data-answer="${q.id}|${o}">${o}</button>`).join('')}</div><div class="change-answer" data-change-for="${q.id}" hidden><textarea data-draft="${q.id}" placeholder="Describe what should change…">${escape(state.drafts[q.id]||'')}</textarea><button class="btn primary small" data-submit-text="${q.id}">Send change</button></div>`}</div>`}</article>`}
function sessionSurface(condensed=false){const s=sessions.find(x=>x.id===state.session)||sessions[0];if(condensed){const icons={chat:'◉',files:'□',git:'⑂',terminal:'>_'};return `<section class="session-shell"><header class="session-context"><strong>${cap(state.tool)}</strong><span class="anchor">${s.anchor} · explicit session anchor</span></header><div class="session-work-area"><nav class="tool-rail" aria-label="Session tools">${['chat','files','git','terminal'].map(t=>`<button class="rail-tool ${state.tool===t?'on':''}" data-tool="${t}" aria-label="${cap(t)}" title="${cap(t)}">${icons[t]}</button>`).join('')}</nav>${surface(s)}</div></section>`}return `<section class="session-shell"><header class="session-context"><nav class="tools">${['chat','files','git','terminal'].map(t=>`<button class="tool ${state.tool===t?'on':''}" data-tool="${t}">${cap(t)}</button>`).join('')}</nav><span class="anchor">${s.anchor} · explicit session anchor</span></header>${surface(s)}</section>`}
function surface(s){if(state.tool==='files')return `<div class="files"><nav class="tree"><strong>Files</strong>${['PRODUCT.md','docs/contracts/workstreams.md','docs/contracts/graphical-attention.md','packages/pi-web-integration/pi-web-plugin.js'].map((f,i)=>`<button class="file ${i===1?'on':''}">${i===1?'▾':'·'} ${f}</button>`).join('')}</nav><pre class="code"># Workstream Specification\n\nA Workstream answers what the owner was doing,\nwhat changed, what needs human action, and where\nwork can resume after interruption or time away.</pre></div>`;if(state.tool==='git')return `<div class="git"><aside class="changes"><strong>Changes · 4</strong><button class="file on">M pi-web-plugin.js</button><button class="file">M workstreams.md</button><button class="file">A structure-prototype.html</button></aside><div class="diff"><div><span>84</span><span>renderWorkstream({</span></div><div class="del"><span>85</span><span>- persistentPanes: true</span></div><div class="add"><span>85</span><span>+ entry: 'brief'</span></div><div class="add"><span>86</span><span>+ questions: answerableTasks</span></div><div><span>87</span><span>})</span></div></div></div>`;if(state.tool==='terminal')return `<pre class="terminal"><span class="prompt">pi-workbench $</span> git status --short\n M packages/pi-web-integration/pi-web-plugin.js\n?? .scratch/workstreams-ui/pi-web-structure-prototype.html\n\n<span class="prompt">pi-workbench $</span> <span aria-hidden="true">▋</span></pre>`;return `<div class="surface"><div class="chat"><article class="message user"><div class="meta"><strong>You</strong><span>10:42</span></div>The design needs to be about the structure and UX of the Workbench.</article><article class="message"><div class="meta"><strong>Pi</strong><span>10:43 · ${s.title}</span></div>I’ll separate durable Workstream continuity from session conversation. Human Tasks will become answerable requests with explicit provenance instead of generic checkboxes.</article><div class="tool-event">✓ read Workstream projection · current revision 12<br>✓ inspect session ask_user questions and answer records</div><article class="message"><div class="meta"><strong>Pi</strong><span>10:45</span></div>The Workstream remains authoritative for pending Human Tasks. Selecting a task can reveal its source session and the exact question without treating the transcript as current state.</article></div><footer class="composer"><div class="compose-box"><textarea aria-label="Message Pi" placeholder="Message Pi…"></textarea><button class="btn primary">Send</button></div><div class="compose-meta"><span>Lead · high</span><span>${s.anchor}</span></div></footer></div>`}
function room(){return `<main class="room"><aside class="room-nav"><div class="nav-head"><strong>Workstreams</strong><button class="btn icon small">＋</button></div><div class="nav-section"><button class="nav-ws on" data-route="brief"><strong>Redesign PI WEB</strong><br><span class="badge warn">3 need you</span></button><div class="nav-title">Sessions</div>${sessions.map(s=>`<button class="nav-session ${state.session===s.id?'on':''}" data-session="${s.id}"><strong>${s.title}</strong><small>${s.anchor}</small></button>`).join('')}</div></aside><section class="room-main">${sessionSurface()}</section><aside class="room-tasks"><div class="tasks-head"><strong>Needs you · 3</strong><span class="badge warn">Workstream</span></div><div class="question-list">${questions.map(q=>questionCard(q,true)).join('')}</div></aside></main>`}
function brief(){return `<main class="brief"><div class="brief-top"><div><span class="badge warn">Checkpoint stale after new activity</span><h1 style="margin-top:9px">Redesign the overall PI WEB experience</h1><p class="brief-intro">A finite attention container across pi-workbench and pi-web. Revision 12.</p></div><div><button class="btn">Close Workstream</button> <button class="btn primary" data-session="shape">Continue in session</button></div></div><div class="brief-grid"><section class="brief-section"><h2>Current continuation</h2><dl class="checkpoint"><dt>What changed</dt><dd>The owner rejected both the current Workstream UX and the broader Chat experience.</dd><dt>What remains</dt><dd>Choose a coherent desktop structure before production planning.</dd><dt>Next useful action</dt><dd>Compare three structural models and answer the open design questions.</dd></dl><p class="checkpoint-meta">Confirmed by owner · source: Shape overall PI WEB · revision 12</p></section><section class="brief-section"><h2>Needs you · ${questions.filter(q=>!state.answers[q.id]).length}</h2><div class="question-list">${questions.map(q=>questionCard(q)).join('')}</div></section></div><section class="session-index"><div class="nav-head" style="padding-inline:6px"><strong>Sessions · 3</strong><button class="btn small">New session</button></div>${sessions.map(s=>`<button class="session-row" data-session="${s.id}"><strong>${s.title}</strong><span class="session-update"><span>${s.update}</span><small>${s.time} · latest confirmed session update</small></span><small>${s.anchor}</small><span class="btn small">Open conversation</span></button>`).join('')}</section></main>`}
function renderBriefDrawer(){return `<section class="brief-drawer" aria-label="Workstream brief"><header class="brief-drawer-head"><div><span class="badge warn">Checkpoint stale after new activity</span><h2>Workstream brief</h2><span class="meta">Redesign the overall PI WEB experience · revision 12</span></div><div>${state.briefPreparing?`<button class="btn" disabled>Preparing…</button>`:state.briefEditing?`<button class="btn" data-cancel-brief>Discard draft</button>`:`<button class="btn" data-prepare-brief>Prepare updated brief</button>`} <button class="btn icon brief-toggle" data-toggle-brief aria-label="Close Workstream brief" title="Close Workstream brief">×</button></div></header>${state.briefPreparing?`<div class="curator-status preparing"><i></i><span><strong>Brief Curator is reading current session transcripts…</strong><br><span class="no-session-note">Visible bounded preparation · read-only · no interactive session added</span></span></div>`:''}${state.briefEditing?`<form class="brief-editor"><label>Prepared from current Workstream context<span class="no-session-note">Fresh Brief Curator · canonical revision 12 · transcript cutoffs captured before generation</span><span class="source-cuts"><span class="source-cut">Shape UI · msg 1–148</span><span class="source-cut">Contracts · msg 1–67</span><span class="source-cut">Host shell · msg 1–92</span></span></label><label>What changed<textarea>The structural direction now combines a persistent session hierarchy, collapsible horizontal tabs, a Workstream brief drawer, and one integrated PI menu.</textarea></label><label>What remains<textarea>Resolve how answerable Human Tasks and bounded subagent work contribute to the confirmed return brief.</textarea></label><label>Next useful continuation<textarea>Confirm this draft, then prototype the complete desktop flow using the selected hierarchy.</textarea></label><div class="editor-actions"><button type="button" class="btn" data-cancel-brief>Discard</button><button type="button" class="btn primary" data-save-brief>Confirm updated brief</button></div></form>`:''}<div class="drawer-grid"><section><span class="label">Next useful continuation</span><p class="continuation">Choose the structural model, then build the complete desktop interaction prototype.</p><dl class="checkpoint"><dt>What changed</dt><dd>The shell now uses one persistent Workstream and session hierarchy.</dd><dt>What remains</dt><dd>Confirm how the brief and answerable Human Tasks enter active session work.</dd></dl></section><section><span class="label">Needs you · ${questions.filter(q=>!state.answers[q.id]).length}</span>${questions.map(q=>`<button class="file" data-toggle-tray>${q.title}</button>`).join('')}</section></div><div class="drawer-session-updates"><span class="label" style="margin-top:14px">Latest confirmed session updates</span>${sessions.map(s=>`<div class="drawer-update"><strong>${s.title}</strong><span>${s.update}</span><small>${s.time}</small></div>`).join('')}</div></section>`}function briefSession(){return `<main class="hierarchy ${state.tray?'with-tray':''} ${state.sessionsExpanded?'':'sessions-collapsed'}">${state.sessionsExpanded?`<aside class="hierarchy-sessions"><div class="nav-head"><strong>Sessions · ${sessions.length}</strong><span><button class="btn icon small" data-toggle-session-layout aria-label="Collapse session navigation" title="Collapse to horizontal tabs">⇤</button> <button class="btn icon small">＋</button></span></div>${sessions.map(s=>`<div><button class="hierarchy-session ${state.session===s.id?'on':''}" data-session="${s.id}"><i></i><span><strong>${s.title}${s.delegations.some(d=>d.status==='active')?` <span class="child-badge">${s.delegations.filter(d=>d.status==='active').length}</span>`:''}</strong><small>${s.summary}</small><small>${s.anchor}</small></span></button>${state.session===s.id&&s.delegations.length?`<div class="delegations" aria-label="Delegations from ${s.title}">${s.delegations.map(d=>`<div class="delegation ${d.status}"><i></i><span><strong>${d.title}</strong>${d.meta}</span><button>${d.status==='active'?'Cancel':'Inspect'}</button></div>`).join('')}</div>`:''}</div>`).join('')}</aside>`:''}<section class="hierarchy-workspace">${sessionSurface(true)}</section>${state.tray?`<aside class="answer-tray"><h2>Human Tasks from this Workstream</h2><div class="question-list">${questions.map(q=>questionCard(q)).join('')}</div></aside>`:''}${state.briefDrawer?renderBriefDrawer():''}</main>`}
function desk(){const selected=questions.find(q=>q.id===state.selectedTask)||questions[0];return `<main class="desk"><nav class="desk-nav"><div class="nav-title">Attention</div><button class="on" data-route="attention">Needs you <span class="nav-count">${questions.filter(q=>!state.answers[q.id]).length}</span></button><button>Recently answered</button><div class="nav-title" style="margin-top:14px">Workstreams</div>${workstreams.map(w=>`<button data-workstream="${w.id}">${w.title}<span class="nav-count">${w.tasks||''}</span></button>`).join('')}<div class="nav-title" style="margin-top:14px">Locations</div><button>Projects & checkouts</button></nav><section class="attention-main"><header><div><h1>Needs you</h1><p>Answer requests across Workstreams without searching conversations.</p></div><span class="badge warn">${questions.filter(q=>!state.answers[q.id]).length} open</span></header><div class="question-list">${questions.map(q=>questionCard(q)).join('')}</div></section><aside class="attention-context"><header class="context-head"><h2>${selected.title}</h2><p>Redesign PI WEB · from ${selected.source}</p></header><div class="context-body"><h3>Why this is here</h3><p>${selected.detail}</p><h3>Source session</h3><p>${selected.source}<br>pi-workbench · workstreams-ui</p><h3>Latest confirmed continuation</h3><p>Compare structural models, then approve one for the complete desktop prototype.</p><div class="context-actions"><button class="btn" data-session="${selected.source.includes('Inspect')?'host':'shape'}">Open conversation</button><button class="btn quiet" data-route="brief">Open Workstream</button></div></div></aside></main>`}
function renderBody(){if(state.route==='portfolio')return portfolio();if(state.model==='room')return room();if(state.model==='brief')return state.route==='session'?briefSession():brief();if(state.route==='session')return `<main class="desk-session"><nav class="desk-nav"><button data-route="attention">← Needs you</button>${sessions.map(s=>`<button class="${state.session===s.id?'on':''}" data-session="${s.id}">${s.title}</button>`).join('')}</nav>${sessionSurface()}</main>`;return desk()}
function render(){document.querySelector('#stage').innerHTML=`<div class="app">${global()}<div class="body">${renderBody()}</div></div>`;bind();syncUrl()}
function bind(){document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{state.model=b.dataset.model;state.route=state.model==='desk'?'attention':'portfolio';state.shellMenu=false;state.briefDrawer=false;render()});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;state.shellMenu=false;state.briefDrawer=false;render()});document.querySelectorAll('[data-workstream]').forEach(b=>b.onclick=()=>{state.shellMenu=false;if(state.model==='desk')state.route='attention';else if(state.model==='brief'){state.route='session';state.briefDrawer=true}else state.route='brief';render()});document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{state.session=b.dataset.session;state.route='session';state.briefDrawer=false;render()});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool;render()});document.querySelectorAll('[data-toggle-shell-menu]').forEach(b=>b.onclick=()=>{state.shellMenu=!state.shellMenu;render()});document.querySelectorAll('[data-toggle-brief]').forEach(b=>b.onclick=()=>{state.briefDrawer=!state.briefDrawer;state.briefPreparing=false;state.briefEditing=false;render()});document.querySelectorAll('[data-prepare-brief]').forEach(b=>b.onclick=()=>{state.briefPreparing=true;state.briefEditing=false;render();window.setTimeout(()=>{state.briefPreparing=false;state.briefEditing=true;render()},900)});document.querySelectorAll('[data-cancel-brief]').forEach(b=>b.onclick=()=>{state.briefPreparing=false;state.briefEditing=false;render()});document.querySelectorAll('[data-save-brief]').forEach(b=>b.onclick=()=>{state.briefEditing=false;render()});document.querySelectorAll('[data-toggle-session-layout]').forEach(b=>b.onclick=()=>{state.sessionsExpanded=!state.sessionsExpanded;render()});document.querySelectorAll('[data-toggle-tray]').forEach(b=>b.onclick=()=>{state.tray=!state.tray;state.briefDrawer=false;render()});document.querySelectorAll('[data-select-task]').forEach(el=>el.onclick=e=>{if(e.target.closest('button,textarea'))return;state.selectedTask=el.dataset.selectTask;render()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const [id,value]=b.dataset.answer.split('|');if(value==='Change'){document.querySelector(`[data-change-for="${id}"]`).hidden=false;document.querySelector(`[data-change-for="${id}"] textarea`).focus();return}state.answers[id]=value;render()});document.querySelectorAll('[data-draft]').forEach(t=>t.oninput=()=>{state.drafts[t.dataset.draft]=t.value});document.querySelectorAll('[data-submit-text]').forEach(b=>b.onclick=()=>{const id=b.dataset.submitText;const value=(state.drafts[id]||'').trim();if(value){state.answers[id]=value;render()}});document.querySelectorAll('[data-edit-answer]').forEach(b=>b.onclick=()=>{delete state.answers[b.dataset.editAnswer];render()})}
function syncUrl(){const u=new URL(location.href);u.searchParams.delete('model');history.replaceState(null,'',u)}function cap(v){return v[0].toUpperCase()+v.slice(1)}function escape(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
render();
</script></body></html>
