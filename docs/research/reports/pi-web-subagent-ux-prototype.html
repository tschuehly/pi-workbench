<!doctype html>
<html lang="en">
<head>

<title>PROTOTYPE — Subagents inside a Workstream</title>
<!--
PROTOTYPE — throwaway interaction study, not production UI.
QUESTION: How should one parent Pi session expose bounded child Pi inputs, progress, cancellation, and outcomes without making children peer Workstream sessions?
THREE VARIANTS: A conversation-native cards; B session-scoped execution tray; C parent-and-child activity map.
TRUTH: One invocation launches one fresh child for one bounded assignment. The attended lead remains accountable. Child sessions are inspectable evidence, not resumable Workstream sessions or durable Runs.
VISUALS: Inherits the neutral hierarchy-first PI WEB prototype so only information architecture changes.
-->
<style>
:root{color-scheme:light;--frame:#202327;--surface:#fff;--surface-2:#f5f7f8;--surface-3:#eaedef;--ink:#20262b;--muted:#5f6b75;--line:#cdd3d8;--line-strong:#8e979f;--blue:#1668a8;--blue-soft:#e7f1f9;--green:#26734d;--green-soft:#e7f3eb;--amber:#8b570f;--amber-soft:#fff2dc;--red:#9a3e3e;--red-soft:#fbeaea;--shadow:0 18px 50px rgba(18,24,29,.2);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--frame);color:var(--ink);-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #84b9df;outline-offset:2px}[hidden]{display:none!important}.lab{min-height:100vh;padding:16px 16px 78px}.stage{width:min(1500px,100%);height:calc(100vh - 96px);min-height:700px;margin:auto;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.app{height:100%;display:grid;grid-template-rows:48px minmax(0,1fr)}.global{display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface)}.brand{display:grid;place-items:center;width:25px;height:25px;border:0;background:var(--ink);color:#fff;font-weight:850}.global strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.divider{width:1px;height:23px;background:var(--line);margin:0 3px}.global-session{font-size:13px}.global-spacer{flex:1}.btn{min-height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:6px 10px;font-weight:650}.btn:hover{background:var(--surface-2)}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.danger{border-color:#be7777;color:var(--red)}.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}.btn.small{min-height:28px;padding:4px 8px;font-size:12px}.btn:disabled{cursor:default;opacity:.55}.icon-btn{width:32px;padding:0}.body{min-height:0;display:grid;grid-template-columns:268px minmax(0,1fr)}
.session-nav{min-height:0;overflow:auto;border-right:1px solid var(--line);background:var(--surface-2)}.nav-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}.session{width:100%;display:grid;grid-template-columns:9px minmax(0,1fr);gap:9px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px;text-align:left}.session:hover{background:var(--surface)}.session.on{background:var(--blue-soft)}.session-dot{width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--green)}.session strong,.session small{display:block}.session small{margin-top:3px;color:var(--muted)}.child-summary{margin:0 9px 10px 25px;padding-left:10px;border-left:1px solid var(--line)}.child-summary button{width:100%;display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:7px;align-items:start;border:0;background:transparent;padding:7px 4px;text-align:left;font-size:11px}.child-summary button:hover{background:var(--surface)}.child-summary .dot{width:7px;height:7px;margin-top:4px;border-radius:50%;background:var(--line-strong)}.child-summary .dot.active{background:var(--green)}.child-summary .dot.warning{background:var(--amber)}.child-summary strong{display:block;font-size:11px}.child-summary small{color:var(--muted)}.count{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:5px;border-radius:999px;background:#dfe6eb;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}.workspace{min-width:0;min-height:0;display:grid;grid-template-rows:44px minmax(0,1fr)}.context-bar{display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}.context-bar .anchor{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.context-tools{display:flex;gap:3px}.context-tool{min-height:30px;border:0;border-radius:5px;background:transparent;padding:5px 9px;color:var(--muted)}.context-tool.on{background:var(--surface);color:var(--blue);font-weight:750}.variant-host{min-width:0;min-height:0;overflow:hidden}
.chat-shell{height:100%;min-height:0;display:flex;flex-direction:column}.chat{flex:1;min-height:0;overflow:auto;padding:24px clamp(28px,8vw,96px) 20px}.message{max-width:72ch;margin:0 0 23px;line-height:1.5}.message.user{max-width:58ch;margin-left:auto;padding:11px 13px;border-radius:10px;background:#edf0f2}.meta{display:flex;align-items:center;gap:7px;margin-bottom:6px;color:var(--muted);font-size:11px}.meta strong{color:var(--ink)}.composer{padding:11px clamp(22px,7vw,86px) 13px;border-top:1px solid var(--line);background:var(--surface)}.compose-box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;padding:9px;border:1px solid var(--line-strong);border-radius:8px}.compose-box textarea{min-height:44px;resize:none;border:0;outline:0}.compose-meta{display:flex;gap:12px;margin-top:6px;color:var(--muted);font-size:11px}.status{display:inline-flex;align-items:center;gap:5px;min-height:22px;border-radius:999px;padding:2px 7px;background:var(--surface-3);color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}.status.running,.status.success{background:var(--green-soft);color:var(--green)}.status.warning,.status.cancelling{background:var(--amber-soft);color:var(--amber)}.status.failed,.status.cancelled{background:var(--red-soft);color:var(--red)}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.035em;text-transform:uppercase}.muted{color:var(--muted)}
/* A — conversation-native */
.invocation{max-width:76ch;margin:0 0 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.invocation-head{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;border-radius:10px;background:var(--surface-2);padding:11px 12px;text-align:left}.invocation-head:hover{background:#edf1f4}.child-glyph{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--ink);color:#fff;font-size:12px;font-weight:800}.invocation-head strong,.invocation-head small{display:block}.invocation-head small{margin-top:2px;color:var(--muted)}.invocation-body{padding:14px}.task-text{max-width:72ch;margin:0;line-height:1.45}.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.input-grid p{margin:0;font-size:12px}.observations{margin-top:15px;border-top:1px solid var(--line)}.observation{display:grid;grid-template-columns:68px minmax(0,1fr);gap:9px;padding:8px 0;border-bottom:1px solid #e3e7ea;font-size:12px}.observation time{color:var(--muted);font-variant-numeric:tabular-nums}.invocation-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}.result{margin-top:14px;padding:12px;background:var(--green-soft);color:#20593d;line-height:1.45}.result.warning{background:var(--amber-soft);color:#73470d}
/* B — tray */
.tray-layout{height:100%;display:grid;grid-template-columns:minmax(480px,1fr) 430px}.tray-layout .chat{padding-inline:clamp(25px,6vw,72px)}.chat-marker{max-width:72ch;margin:0 0 20px}.chat-marker button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:9px 10px;text-align:left}.chat-marker button:hover{border-color:var(--line-strong)}.execution-tray{min-height:0;display:grid;grid-template-rows:auto 176px minmax(0,1fr);border-left:1px solid var(--line);background:var(--surface-2)}.tray-head{display:flex;align-items:start;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.tray-head h2{margin:0 0 4px;font-size:15px}.tray-head p{margin:0;color:var(--muted);font-size:11px}.execution-list{overflow:auto;border-bottom:1px solid var(--line);padding:6px}.execution-row{width:100%;display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:9px;border:0;border-radius:6px;background:transparent;padding:9px;text-align:left}.execution-row:hover{background:var(--surface)}.execution-row.on{background:var(--blue-soft)}.execution-row .state-dot{width:7px;height:7px;margin-top:5px;border-radius:50%;background:var(--line-strong)}.execution-row .state-dot.running{background:var(--green)}.execution-row .state-dot.warning{background:var(--amber)}.execution-row strong,.execution-row small{display:block}.execution-row small{margin-top:2px;color:var(--muted)}.detail{min-height:0;overflow:auto;padding:15px}.detail h3{margin:0 0 5px;font-size:16px}.detail-top{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:17px}.fact-list{display:grid;grid-template-columns:105px minmax(0,1fr);gap:8px 10px;margin:0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}.fact-list dt{color:var(--muted);font-weight:700}.fact-list dd{margin:0;overflow-wrap:anywhere}.detail section{margin-top:17px}.detail section h4{margin:0 0 7px;font-size:12px}.detail section p{margin:0;line-height:1.5}.detail-actions{display:flex;gap:7px;margin-top:16px}
/* C — activity map */
.map-layout{height:100%;display:grid;grid-template-columns:minmax(480px,1fr) 380px}.map-main{min-height:0;overflow:auto;padding:24px clamp(24px,5vw,60px)}.map-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.map-head h1{margin:0 0 5px;font-size:22px;letter-spacing:-.02em}.map-head p{max-width:66ch;margin:0;color:var(--muted);font-size:12px}.lead-node{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong)}.lead-mark{display:grid;place-items:center;width:38px;height:38px;background:var(--ink);color:#fff;font-weight:850}.lead-node strong,.lead-node small{display:block}.lead-node small{margin-top:3px;color:var(--muted)}.branches{position:relative;margin-left:20px;padding:20px 0 8px 38px}.branches::before{content:"";position:absolute;left:0;top:0;bottom:27px;width:1px;background:var(--line-strong)}.branch{position:relative;width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 8px;text-align:left}.branch::before{content:"";position:absolute;left:-38px;top:22px;width:38px;height:1px;background:var(--line-strong)}.branch:hover,.branch.on{background:var(--blue-soft)}.branch .branch-dot{width:9px;height:9px;margin-top:4px;border-radius:50%;background:var(--line-strong)}.branch .branch-dot.running{background:var(--green)}.branch .branch-dot.warning{background:var(--amber)}.branch strong,.branch small{display:block}.branch small{margin-top:3px;color:var(--muted)}.branch .status{margin-top:-2px}.map-note{margin:18px 0 0 58px;color:var(--muted);font-size:11px}.inspector{min-height:0;overflow:auto;border-left:1px solid var(--line);background:var(--surface-2);padding:18px}.inspector h2{margin:0 0 5px;font-size:17px}.inspector .task-box{margin:16px 0;padding:12px;background:var(--surface);line-height:1.45;font-size:12px}.timeline{margin-top:16px}.timeline-row{display:grid;grid-template-columns:64px 10px minmax(0,1fr);gap:8px;padding:6px 0;font-size:11px}.timeline-row time{color:var(--muted)}.timeline-row i{width:7px;height:7px;margin-top:4px;border-radius:50%;background:var(--line-strong)}
.prototype-switch{position:fixed;left:50%;bottom:15px;z-index:100;display:grid;grid-template-columns:38px minmax(210px,auto) 38px;align-items:center;transform:translateX(-50%);padding:5px;background:#111;color:#fff;box-shadow:0 9px 28px rgba(0,0,0,.42)}.prototype-switch button{min-height:36px;border:0;background:transparent;color:#ddd}.prototype-switch button:hover{background:#2c2c2c}.prototype-label{text-align:center;font-size:12px;font-weight:700}.prototype-label small{display:block;margin-top:2px;color:#aeb3b7;font-weight:500}
@media(max-width:1050px){.body{grid-template-columns:230px minmax(0,1fr)}.tray-layout{grid-template-columns:minmax(400px,1fr) 370px}.map-layout{grid-template-columns:minmax(400px,1fr) 340px}.context-bar .anchor{display:none}}@media(max-width:780px){.lab{padding:0 0 76px}.stage{height:calc(100vh - 76px);min-height:620px}.body{grid-template-columns:1fr}.session-nav{display:none}.global .global-session{display:none}.tray-layout,.map-layout{grid-template-columns:1fr}.execution-tray,.inspector{position:absolute;inset:92px 0 0 0;border-left:0}.tray-layout.show-chat .execution-tray,.map-layout.show-map .inspector{display:none}.chat{padding-inline:18px}.input-grid{grid-template-columns:1fr}.prototype-switch{width:calc(100% - 22px)}}
@media(prefers-reduced-motion:no-preference){.invocation-body,.detail,.inspector>*{animation:reveal 180ms cubic-bezier(.2,.8,.2,1)}@keyframes reveal{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="lab"><div id="stage" class="stage"></div></div>
<nav class="prototype-switch" aria-label="Subagent display variants">
  <button data-prev aria-label="Previous variant">←</button>
  <div id="variant-label" class="prototype-label"></div>
  <button data-next aria-label="Next variant">→</button>
</nav>
<script>
const variants={A:'Conversation-native cards',B:'Session execution tray',C:'Parent-and-child map'};
const children=[
 {id:'challenge',title:'Challenge the Workbench hierarchy',status:'running',profile:'reviewer',role:'gpt-adversary',binding:'anthropic/claude-opus-4-6 · high',quota:'admitted',elapsed:'2m 14s',sessionId:'019fd741-35cc-7c02-aabc-477b65d53910',task:'Review the hierarchy-first PI WEB prototype against the Workstream and graphical-attention contracts. Name structural contradictions, accessibility risks, and the smallest viable corrections. Do not edit files.',result:'',observations:[['10:46:02','Resolved runtime binding and verified model'],['10:46:05','Read Workstream and interface contracts'],['10:47:21','Comparing collapsed-session and Human Task states']]},
 {id:'seams',title:'Map incumbent navigation seams',status:'success',profile:'scout',role:'system-comprehension',binding:'openai/gpt-5.4-mini · medium',quota:'degraded-quota-telemetry',elapsed:'3m 08s',sessionId:'019fd72a-8b7b-75df-8fa8-783fd64b7be9',task:'Inspect the PI WEB shell and identify which navigation, session, and tool surfaces are core-owned versus Workbench-owned. Return file paths and a compact ownership map. Do not edit files.',result:'Mapped five host seams. PI WEB owns global controls and session tools; the Workbench adapter owns Workstream selection, canonical session association, and the hierarchy that mounts the selected Chat surface.',observations:[['10:38:14','Launched with degraded quota telemetry'],['10:38:29','Inspected host contributions and session controller'],['10:41:22','Returned compact ownership map']]},
 {id:'cancel',title:'Verify cancellation cleanup',status:'warning',profile:'implementer',role:'hard-execution',binding:'openai/gpt-5.4 · high',quota:'admitted',elapsed:'1m 47s',sessionId:'019fd716-23b4-71f9-bdf1-99758c2f18c8',task:'Add one deterministic cancellation fixture to the Pi execution adapter and run its focused test. Stop without committing. Report the changed path and exact test result.',result:'Termination could not be reconciled after RPC abort and forced process cleanup. Outcome is unknown; inspect the persisted Pi session and repository state before retrying.',observations:[['10:31:08','Started adapter test edit'],['10:32:17','Cancellation requested by parent'],['10:32:55','Process termination not confirmed — outcome unknown']]}
];
const state={variant:new URL(location.href).searchParams.get('variant')||'A',selected:'challenge',expanded:'challenge',cancelState:null,mobilePrimary:false};
if(!variants[state.variant])state.variant='A';
function child(id){return children.find(item=>item.id===id)||children[0]}
function effectiveStatus(item){return item.id==='challenge'&&state.cancelState?state.cancelState:item.status}
function statusLabel(item){const value=effectiveStatus(item);return value==='running'?'Running':value==='success'?'Succeeded':value==='warning'?'Outcome unknown':value==='cancelling'?'Cancelling…':value==='cancelled'?'Cancelled':value}
function statusClass(item){return effectiveStatus(item)}
function shell(content){return `<div class="app"><header class="global"><button class="brand" aria-label="Open PI WEB navigation">π</button><strong>Redesign PI WEB</strong><button class="btn icon-btn small" title="Open Workstream brief" aria-label="Open Workstream brief">▤</button><span class="divider"></span><strong class="global-session">Shape overall PI WEB</strong><span class="global-spacer"></span><button class="btn small">Needs you · 3</button></header><div class="body">${sessionNav()}<main class="workspace"><header class="context-bar"><nav class="context-tools" aria-label="Session tools"><button class="context-tool on">Chat</button><button class="context-tool">Files</button><button class="context-tool">Git</button><button class="context-tool">Terminal</button></nav><span class="anchor">pi-workbench · workstreams-ui · explicit session anchor</span></header><div class="variant-host">${content}</div></main></div></div>`}
function sessionNav(){return `<aside class="session-nav"><div class="nav-head"><strong>Sessions · 3</strong><span><button class="btn icon-btn small" aria-label="Collapse sessions">⇤</button> <button class="btn icon-btn small" aria-label="New session">＋</button></span></div><div><button class="session on"><i class="session-dot"></i><span><strong>Shape overall PI WEB <span class="count">1</span></strong><small>Compare structural models and interaction hierarchy</small><small>pi-workbench · workstreams-ui</small></span></button><div class="child-summary" aria-label="Bounded child executions from Shape overall PI WEB">${children.map(item=>`<button data-select="${item.id}"><i class="dot ${statusClass(item)==='running'||statusClass(item)==='cancelling'?'active':statusClass(item)==='warning'?'warning':''}"></i><span><strong>${item.title}</strong><small>${item.profile} · ${statusLabel(item)}</small></span><span aria-hidden="true">›</span></button>`).join('')}</div></div><button class="session"><i class="session-dot"></i><span><strong>Reconcile interface contracts</strong><small>Waiting for the selected UX model</small><small>pi-workbench · workstreams-ui</small></span></button><button class="session"><i class="session-dot"></i><span><strong>Inspect PI WEB shell</strong><small>Map shell-owned controls</small><small>pi-web · main</small></span></button></aside>`}
function composer(){return `<footer class="composer"><div class="compose-box"><textarea aria-label="Message Pi" placeholder="Message Pi…"></textarea><button class="btn primary">Send</button></div><div class="compose-meta"><span>Lead · high</span><span>Child progress stays out of parent Model Context until terminal result</span></div></footer>`}
function basicMessages(marker=''){return `<article class="message user"><div class="meta"><strong>You</strong><span>10:42</span></div>Investigate how bounded child Pi work should appear inside this Workstream.</article><article class="message"><div class="meta"><strong>Pi</strong><span>10:43 · lead session</span></div>I’ll keep each child execution subordinate to this session. The child gets a fresh context and a self-contained assignment; I remain accountable for reconciling its compact result.</article>${marker}`}
function invocationCard(item){const open=state.expanded===item.id;return `<article class="invocation"><button class="invocation-head" data-expand="${item.id}" aria-expanded="${open}"><span class="child-glyph">↳π</span><span><strong>${item.title}</strong><small>Bounded child · ${item.profile} · ${item.role} · ${item.elapsed}</small></span><span class="status ${statusClass(item)}">${statusLabel(item)}</span></button>${open?`<div class="invocation-body"><span class="label">Input sent to fresh child context</span><p class="task-text">${item.task}</p><div class="input-grid"><div><span class="label">Child behavior</span><p><strong>${item.profile}</strong> profile<br><span class="muted">${item.role}</span></p></div><div><span class="label">Resolved runtime</span><p>${item.binding}<br><span class="muted">Quota: ${item.quota}</span></p></div></div><div class="observations">${item.observations.map(row=>`<div class="observation"><time>${row[0]}</time><span>${row[1]}</span></div>`).join('')}</div>${item.result?`<div class="result ${item.status==='warning'?'warning':''}"><span class="label">Compact result returned to lead</span>${item.result}</div>`:''}<div class="invocation-actions"><span class="mono muted">Pi session ${item.sessionId}</span>${effectiveStatus(item)==='running'?`<button class="btn danger small" data-cancel="${item.id}">Cancel child</button>`:effectiveStatus(item)==='cancelling'?`<button class="btn small" disabled>Confirming termination…</button>`:`<button class="btn small" data-copy="${item.sessionId}">Copy session ID</button>`}</div></div>`:''}</article>`}
function variantA(){return shell(`<section class="chat-shell"><div class="chat">${basicMessages()}${children.map(invocationCard).join('')}<article class="message"><div class="meta"><strong>Pi</strong><span>10:49</span></div>The completed child result is a proposal. I’ll reconcile it against the current repository and decide what belongs in our next change.</article></div>${composer()}</section>`)}
function marker(item){return `<div class="chat-marker"><button data-select="${item.id}"><span class="child-glyph">↳π</span><span><strong>${item.title}</strong><br><span class="muted">${item.profile} · ${item.role}</span></span><span class="status ${statusClass(item)}">${statusLabel(item)}</span></button></div>`}
function detail(item){return `<div class="detail-top"><div><h3>${item.title}</h3><span class="muted">One bounded execution from this lead session</span></div><span class="status ${statusClass(item)}">${statusLabel(item)}</span></div><dl class="fact-list"><dt>Profile</dt><dd>${item.profile}</dd><dt>Cognitive Role</dt><dd>${item.role}</dd><dt>Resolved runtime</dt><dd>${item.binding}</dd><dt>Quota admission</dt><dd>${item.quota}</dd><dt>Pi session</dt><dd class="mono">${item.sessionId}</dd></dl><section><h4>Input sent to fresh child context</h4><p>${item.task}</p></section><section><h4>${item.result?'Compact terminal result':'Latest observed progress'}</h4><p>${item.result||item.observations.at(-1)[1]}</p></section><div class="detail-actions">${effectiveStatus(item)==='running'?`<button class="btn danger" data-cancel="${item.id}">Cancel child</button>`:effectiveStatus(item)==='cancelling'?`<button class="btn" disabled>Confirming termination…</button>`:`<button class="btn" data-copy="${item.sessionId}">Copy session ID</button>`}<button class="btn quiet" data-mobile-primary>Back to Chat</button></div>`}
function variantB(){const selected=child(state.selected);return shell(`<div class="tray-layout ${state.mobilePrimary?'show-chat':''}"><section class="chat-shell"><div class="chat">${basicMessages(marker(children[0]))}<article class="message"><div class="meta"><strong>Pi</strong><span>10:44</span></div>I launched two other bounded checks in parallel. Their detailed observations stay in this session’s execution tray; only terminal results return to my context.</article>${children.slice(1).map(marker).join('')}</div>${composer()}</section><aside class="execution-tray" aria-label="Child executions from Shape overall PI WEB"><header class="tray-head"><div><h2>Child executions · ${children.length}</h2><p>This lead session only · not resumable sessions</p></div><button class="btn icon-btn small" data-mobile-primary aria-label="Return to Chat">×</button></header><div class="execution-list">${children.map(item=>`<button class="execution-row ${state.selected===item.id?'on':''}" data-select="${item.id}"><i class="state-dot ${statusClass(item)}"></i><span><strong>${item.title}</strong><small>${item.profile} · ${item.elapsed}</small></span><span class="status ${statusClass(item)}">${statusLabel(item)}</span></button>`).join('')}</div><div class="detail">${detail(selected)}</div></aside></div>`)}
function inspector(item){return `<span class="status ${statusClass(item)}">${statusLabel(item)}</span><h2>${item.title}</h2><p class="muted">Subordinate to Shape overall PI WEB</p><div class="task-box"><span class="label">Self-contained input</span>${item.task}</div><dl class="fact-list"><dt>Profile / role</dt><dd>${item.profile} / ${item.role}</dd><dt>Runtime</dt><dd>${item.binding}</dd><dt>Quota</dt><dd>${item.quota}</dd><dt>Pi session</dt><dd class="mono">${item.sessionId}</dd></dl><div class="timeline"><span class="label">Observed activity</span>${item.observations.map(row=>`<div class="timeline-row"><time>${row[0]}</time><i></i><span>${row[1]}</span></div>`).join('')}</div>${item.result?`<section class="result ${item.status==='warning'?'warning':''}"><span class="label">Terminal result</span>${item.result}</section>`:''}<div class="detail-actions">${effectiveStatus(item)==='running'?`<button class="btn danger" data-cancel="${item.id}">Cancel child</button>`:effectiveStatus(item)==='cancelling'?`<button class="btn" disabled>Confirming termination…</button>`:`<button class="btn" data-copy="${item.sessionId}">Copy session ID</button>`}<button class="btn quiet" data-mobile-primary>Back to map</button></div>`}
function variantC(){const selected=child(state.selected);return shell(`<div class="map-layout ${state.mobilePrimary?'show-map':''}"><section class="map-main"><header class="map-head"><div><h1>Activity from this lead session</h1><p>A session-local map of attended delegation. Branches end at one terminal result; they never become peer conversations.</p></div><span class="status running">Lead attended</span></header><div class="lead-node"><span class="lead-mark">π</span><span><strong>Shape overall PI WEB</strong><small>Interactive lead · accountable for synthesis and repository state</small></span><span class="mono muted">session 019fd6f…</span></div><div class="branches">${children.map(item=>`<button class="branch ${state.selected===item.id?'on':''}" data-select="${item.id}"><i class="branch-dot ${statusClass(item)}"></i><span><strong>${item.title}</strong><small>${item.profile} · ${item.role}<br>${item.elapsed} · one bounded invocation</small></span><span class="status ${statusClass(item)}">${statusLabel(item)}</span></button>`).join('')}</div><p class="map-note">The lead receives compact terminal text, not this detailed observation stream.</p></section><aside class="inspector" aria-label="Selected bounded child execution">${inspector(selected)}</aside></div>`)}
function render(){const content=state.variant==='A'?variantA():state.variant==='B'?variantB():variantC();document.querySelector('#stage').innerHTML=content;document.querySelector('#variant-label').innerHTML=`${state.variant} — ${variants[state.variant]}<small>?variant=${state.variant}</small>`;bind();syncUrl()}
function bind(){document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{state.selected=el.dataset.select;state.expanded=el.dataset.select;state.mobilePrimary=false;render()});document.querySelectorAll('[data-expand]').forEach(el=>el.onclick=()=>{state.expanded=state.expanded===el.dataset.expand?null:el.dataset.expand;render()});document.querySelectorAll('[data-cancel]').forEach(el=>el.onclick=()=>{state.cancelState='cancelling';render();setTimeout(()=>{state.cancelState='cancelled';render()},900)});document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=async()=>{await navigator.clipboard?.writeText(el.dataset.copy);el.textContent='Copied';setTimeout(render,700)});document.querySelectorAll('[data-mobile-primary]').forEach(el=>el.onclick=()=>{state.mobilePrimary=!state.mobilePrimary;render()})}
function cycle(delta){const keys=Object.keys(variants);state.variant=keys[(keys.indexOf(state.variant)+delta+keys.length)%keys.length];state.mobilePrimary=false;render()}
document.querySelector('[data-prev]').onclick=()=>cycle(-1);document.querySelector('[data-next]').onclick=()=>cycle(1);window.addEventListener('keydown',event=>{if(event.target.matches('textarea,input,[contenteditable]'))return;if(event.key==='ArrowLeft')cycle(-1);if(event.key==='ArrowRight')cycle(1)});function syncUrl(){const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url)}
render();
</script>
</body>
</html>
