<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stage navigation with counts · Atelier candidate</title>
  <!-- Original example; provenance and licence assessment: README.md. -->
  <style>
    .candidate { color:var(--candidate-ink,#20252b); background:var(--candidate-paper,#fff); font:1rem/1.5 system-ui,sans-serif; padding:1rem; }
    .candidate *, .candidate *::before, .candidate *::after { box-sizing:border-box; }
    .candidate :is(button,input,select,textarea) { font:inherit; }
    .candidate button, .candidate select { min-height:2rem; cursor:pointer; }
    .candidate :focus-visible { outline:2px solid var(--candidate-link,#1257a0); outline-offset:3px; }
    .candidate a { color:var(--candidate-link,#1257a0); text-underline-offset:.2em; }
    .candidate [hidden] { display:none!important; }
    .candidate :is(pre,code) { overflow-wrap:anywhere; } .candidate pre { overflow:auto; }
    .candidate :is(section,article,figure,div) { min-width:0; }
    .candidate :is(h1,h2,h3,p,figure) { margin:0 0 .75rem; }
    .candidate h1 { font-size:1.5rem; } .candidate h2 { font-size:1.25rem; }
    .candidate small { font-size:.875rem; } .candidate table { border-collapse:collapse; }
    .candidate :is(th,td) { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #a8adb3; }
    .candidate [atl-key] { scroll-margin-block:5rem; }
    .stage-nav ol { display:flex; gap:1rem; list-style:none; padding:0; overflow-x:auto; white-space:nowrap; }
  </style>
</head>
<body>
<main class="candidate stage-nav" data-component="stage-nav">
  <p data-demo><small>Beispieldaten · Ohne Kernel wird nichts gespeichert.</small></p>
  <h1>Wo du entscheiden kannst</h1>
  <p>Offen: 2 · Entschieden: 1 <small>(Beispiel)</small></p>
  <nav aria-label="Pipeline-Stufen"><ol>
    <li><a href="#stage-build">S3 · Bau · 2 offen</a></li><li aria-hidden="true">→</li>
    <li><a href="#stage-render">S4 · Render · 0 offen</a></li>
  </ol></nav>
  <section id="stage-build" atl-key="s3"><h2>Bau</h2><p>Zwei Fragen betreffen die Korrekturschleife.</p></section>
  <section id="stage-render" atl-key="s4"><h2>Render</h2><p>Keine offene Frage in diesem Beispiel.</p></section>
</main>
</body>
</html>
