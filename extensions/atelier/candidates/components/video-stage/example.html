<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ein versioniertes Video prüfen</title>
<style>.video-stage{font:1rem/1.5 system-ui;padding:1rem}.video-stage video{display:block;height:min(72vh,48rem);max-width:100%;aspect-ratio:9/16;object-fit:contain;background:#171717;filter:none}.video-stage .small video{height:24rem}.video-stage button{font:inherit}</style>
<body><main class="video-stage" id="video-stage">
<h1>Video einzeln prüfen</h1><p>Synthetisches Beispiel · eigenen Master und Untertitel einsetzen.</p>
<section atl-key="video-example" atl-ver="media-not-loaded" atl-group>
<button id="video-size" type="button" aria-pressed="false">Kleiner anzeigen</button>
<figure id="video-figure"><video id="review-video" controls playsinline preload="metadata" aria-label="Zu prüfendes Video"></video>
<figcaption>Keine Mediendatei geladen. Comments hängen am äußeren Key, der das Video enthält.</figcaption></figure>
</section></main><script type="module" src="atelier.js"></script><script type="module">
const root=document.getElementById('video-stage');
function render() {
  const small=new URL(location.href).searchParams.get('video-size')==='small', button=root.querySelector('#video-size');
  root.querySelector('#video-figure').classList.toggle('small',small);
  button.setAttribute('aria-pressed',String(small));button.textContent=small?'Größer anzeigen':'Kleiner anzeigen';
}
root.addEventListener('click',e=>{
  if(e.target.id!=='video-size')return;
  const url=new URL(location.href);url.searchParams.set('video-size',url.searchParams.get('video-size')==='small'?'large':'small');history.replaceState(null,'',url);render();
});
addEventListener('popstate',render);document.addEventListener('atelier:update',render);render();
</script></body></html>
