<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scaled app viewport · Atelier candidate</title>
  <!-- Original example; provenance and licence assessment: README.md. -->
  <style>
    .candidate { color:var(--candidate-ink,#20252b); background:var(--candidate-paper,#fff); font:1rem/1.5 system-ui,sans-serif; padding:1rem; }
    .candidate *, .candidate *::before, .candidate *::after { box-sizing:border-box; }
    .candidate :is(button,input,select,textarea) { font:inherit; }
    .candidate button, .candidate select { min-height:2rem; cursor:pointer; }
    .candidate :focus-visible { outline:2px solid var(--candidate-link,#1257a0); outline-offset:3px; }
    .candidate a { color:var(--candidate-link,#1257a0); text-underline-offset:.2em; }
    .candidate [hidden] { display:none!important; }
    .candidate :is(pre,code) { overflow-wrap:anywhere; } .candidate pre { overflow:auto; }
    .candidate :is(section,article,figure,div) { min-width:0; }
    .candidate :is(h1,h2,h3,p,figure) { margin:0 0 .75rem; }
    .candidate h1 { font-size:1.5rem; } .candidate h2 { font-size:1.25rem; }
    .candidate small { font-size:.875rem; } .candidate table { border-collapse:collapse; }
    .candidate :is(th,td) { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #a8adb3; }
    .candidate [atl-key] { scroll-margin-block:5rem; }
    .viewport-frame .stage { overflow:hidden; width:100%; margin-top:1rem; } .viewport-frame iframe { border:1px solid #777; transform-origin:top left; height:900px; display:block; }
  </style>
</head>
<body>
<main class="candidate viewport-frame" data-component="viewport-frame">
  <p data-demo><small>Beispieldaten · Ohne Kernel wird nichts gespeichert.</small></p>
  <h1>App in Prüfbreite ansehen</h1>
  <label>CSS-Breite <select><option>1440</option><option>1024</option><option>390</option></select></label><output></output>
  <div class="stage" atl-key="trial-example" atl-ver="build-example-1"><iframe title="Synthetische App-Vorschau" sandbox srcdoc="<!doctype html><html lang='de'><meta charset='utf-8'><title>Beispiel</title><h1>Beispiel-App</h1><p>Dies ist kein gestartetes Produkt.</p></html>"></iframe></div>
</main>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const stage=root.querySelector('.stage'),frame=root.querySelector('iframe'),select=root.querySelector('select');
  function fit(){const width=Number(select.value),scale=Math.min(1,stage.clientWidth/width);frame.style.width=`${width}px`;frame.style.transform=`scale(${scale})`;stage.style.height=`${900*scale}px`;root.querySelector('output').textContent=` Maßstab ${Math.round(scale*100)} %`;}
  new ResizeObserver(fit).observe(stage);select.addEventListener('change',fit);fit();
})();
</script>
</body>
</html>
