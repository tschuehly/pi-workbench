<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Section switcher · Atelier candidate</title>
  <!-- Original example; provenance and licence assessment: README.md. -->
  <style>
    .candidate { color:var(--candidate-ink,#20252b); background:var(--candidate-paper,#fff); font:1rem/1.5 system-ui,sans-serif; padding:1rem; }
    .candidate *, .candidate *::before, .candidate *::after { box-sizing:border-box; }
    .candidate :is(button,input,select,textarea) { font:inherit; }
    .candidate button, .candidate select { min-height:2rem; cursor:pointer; }
    .candidate :focus-visible { outline:2px solid var(--candidate-link,#1257a0); outline-offset:3px; }
    .candidate a { color:var(--candidate-link,#1257a0); text-underline-offset:.2em; }
    .candidate [hidden] { display:none!important; }
    .candidate :is(pre,code) { overflow-wrap:anywhere; } .candidate pre { overflow:auto; }
    .candidate :is(section,article,figure,div) { min-width:0; }
    .candidate :is(h1,h2,h3,p,figure) { margin:0 0 .75rem; }
    .candidate h1 { font-size:1.5rem; } .candidate h2 { font-size:1.25rem; }
    .candidate small { font-size:.875rem; } .candidate table { border-collapse:collapse; }
    .candidate :is(th,td) { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #a8adb3; }
    .candidate [atl-key] { scroll-margin-block:5rem; }
    .section-switcher nav { display:flex; gap:.5rem; margin-bottom:1rem; } .section-switcher [aria-pressed=true] { font-weight:700; }
  </style>
</head>
<body>
<main class="candidate section-switcher" data-component="section-switcher">
  <p data-demo><small>Beispieldaten · Ohne Kernel wird nichts gespeichert.</small></p>
  <h1>Audit und Lauf</h1>
  <nav aria-label="Ansicht"><button data-panel="switch-audit" aria-pressed="true">Audit</button> <button data-panel="switch-run" aria-pressed="false">Lauf</button></nav>
  <section id="switch-audit" atl-key="audit"><h2>Wie die Pipeline arbeitet</h2><p>Historische Belege, kein Live-Status.</p></section>
  <section id="switch-run" atl-key="run-example" hidden><h2>Dieser Lauf</h2><label>Arbeitsnotiz <input id="switch-draft"></label></section>
</main>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  function show(id) {
    root.querySelectorAll('section').forEach(p => p.hidden = p.id !== id);
    root.querySelectorAll('[data-panel]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.panel === id)));
  }
  root.addEventListener('click', e => { const b=e.target.closest('[data-panel]'); if(b) show(b.dataset.panel); });
  function reveal() {
    let id; try { id=decodeURIComponent(location.hash.slice(1)); } catch { return; }
    const panel=document.getElementById(id)?.closest('section');
    if(panel && root.contains(panel)) show(panel.id);
  }
  addEventListener('hashchange', reveal); reveal();
})();
</script>
</body>
</html>
