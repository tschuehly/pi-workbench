<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Frame evidence strip · Atelier candidate</title>
  <!-- Original example; provenance and licence assessment: README.md. -->
  <style>
    .candidate { color:var(--candidate-ink,#20252b); background:var(--candidate-paper,#fff); font:1rem/1.5 system-ui,sans-serif; padding:1rem; }
    .candidate *, .candidate *::before, .candidate *::after { box-sizing:border-box; }
    .candidate :is(button,input,select,textarea) { font:inherit; }
    .candidate button, .candidate select { min-height:2rem; cursor:pointer; }
    .candidate :focus-visible { outline:2px solid var(--candidate-link,#1257a0); outline-offset:3px; }
    .candidate a { color:var(--candidate-link,#1257a0); text-underline-offset:.2em; }
    .candidate [hidden] { display:none!important; }
    .candidate :is(pre,code) { overflow-wrap:anywhere; } .candidate pre { overflow:auto; }
    .candidate :is(section,article,figure,div) { min-width:0; }
    .candidate :is(h1,h2,h3,p,figure) { margin:0 0 .75rem; }
    .candidate h1 { font-size:1.5rem; } .candidate h2 { font-size:1.25rem; }
    .candidate small { font-size:.875rem; } .candidate table { border-collapse:collapse; }
    .candidate :is(th,td) { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #a8adb3; }
    .candidate [atl-key] { scroll-margin-block:5rem; }
    .frame-strip video { width:20rem; max-width:100%; background:#171717; } .frame-strip .placeholder { width:9rem; aspect-ratio:9/16; border:1px solid #777; display:grid; place-items:center; }
  </style>
</head>
<body>
<main class="candidate frame-strip" data-component="frame-strip">
  <p data-demo><small>Beispieldaten · Ohne Kernel wird nichts gespeichert.</small></p>
  <h1>Beleg zur Sekunde</h1>
  <video controls preload="metadata" aria-label="Video für Zeitsprung"></video>
  <figure atl-key="video-example"><section atl-key="frame-3-2" atl-ver="master-example-1">
    <div class="placeholder" role="img" aria-label="Kein Frame geladen">Frame fehlt</div>
    <figcaption><strong>3,2 s · master-example-1:</strong> Judge: Text liegt im Aktionsbereich.</figcaption>
    <button type="button" data-seek="3.2">Zur Stelle springen · 3,2 s</button><output aria-live="polite"></output>
  </section></figure>
</main>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  root.querySelector('[data-seek]').addEventListener('click',e=>{
    const video=root.querySelector('video'),out=root.querySelector('output');
    if(!Number.isFinite(video.duration)){out.textContent=' Erst ein Video laden.';return;}
    video.pause(); video.currentTime=Math.min(video.duration,Number(e.currentTarget.dataset.seek));video.scrollIntoView({block:'nearest'});
  });
})();
</script>
</body>
</html>
