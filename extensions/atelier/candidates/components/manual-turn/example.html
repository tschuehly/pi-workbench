<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manual turn · Atelier candidate</title>
  <!-- Original example; provenance and licence assessment: README.md. -->
  <style>
    .candidate { color:var(--candidate-ink,#20252b); background:var(--candidate-paper,#fff); font:1rem/1.5 system-ui,sans-serif; padding:1rem; }
    .candidate *, .candidate *::before, .candidate *::after { box-sizing:border-box; }
    .candidate :is(button,input,select,textarea) { font:inherit; }
    .candidate button, .candidate select { min-height:2rem; cursor:pointer; }
    .candidate :focus-visible { outline:2px solid var(--candidate-link,#1257a0); outline-offset:3px; }
    .candidate a { color:var(--candidate-link,#1257a0); text-underline-offset:.2em; }
    .candidate [hidden] { display:none!important; }
    .candidate :is(pre,code) { overflow-wrap:anywhere; } .candidate pre { overflow:auto; }
    .candidate :is(section,article,figure,div) { min-width:0; }
    .candidate :is(h1,h2,h3,p,figure) { margin:0 0 .75rem; }
    .candidate h1 { font-size:1.5rem; } .candidate h2 { font-size:1.25rem; }
    .candidate small { font-size:.875rem; } .candidate table { border-collapse:collapse; }
    .candidate :is(th,td) { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #a8adb3; }
    .candidate [atl-key] { scroll-margin-block:5rem; }
    .manual-turn textarea { display:block; width:100%; min-height:5rem; }
  </style>
</head>
<body>
<main class="candidate manual-turn" data-component="manual-turn">
  <p data-demo><small>Beispieldaten · Ohne Kernel wird nichts gespeichert.</small></p>
  <article atl-key="set-example"><section atl-key="turn-example" atl-ver="test-example-1">
    <h1>Frage im Me-Chat stellen</h1><blockquote>Wie viele Aufträge gab es im Beispielzeitraum?</blockquote>
    <button type="button" data-copy>Frage kopieren</button><output aria-live="polite"></output>
    <p><strong>Erwartet:</strong></p><ul><li>Zeitraum wird genannt.</li><li>Anzahl wird aus der Quelle belegt.</li></ul>
    <form atl-request="attach-console-reply"><label>Antwort oder Console-Export <textarea name="reply" required></textarea></label><button>Antwort zur Auswertung senden</button></form>
  </section></article>
</main>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  root.querySelector('form').addEventListener('submit',e=>e.preventDefault());
  root.querySelector('[data-copy]').addEventListener('click',async()=>{
    const quote=root.querySelector('blockquote'),out=root.querySelector('output');
    try { await navigator.clipboard.writeText(quote.textContent); out.textContent=' Kopiert.'; }
    catch { const range=document.createRange(); range.selectNodeContents(quote); const s=getSelection(); s.removeAllRanges(); s.addRange(range); out.textContent=' Text markiert; mit Kopieren übernehmen.'; }
  });
})();
</script>
</body>
</html>
