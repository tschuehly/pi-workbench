<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Review filter · Atelier candidate</title>
  <!-- Original example; provenance and licence assessment: README.md. -->
  <style>
    .candidate { color:var(--candidate-ink,#20252b); background:var(--candidate-paper,#fff); font:1rem/1.5 system-ui,sans-serif; padding:1rem; }
    .candidate *, .candidate *::before, .candidate *::after { box-sizing:border-box; }
    .candidate :is(button,input,select,textarea) { font:inherit; }
    .candidate button, .candidate select { min-height:2rem; cursor:pointer; }
    .candidate :focus-visible { outline:2px solid var(--candidate-link,#1257a0); outline-offset:3px; }
    .candidate a { color:var(--candidate-link,#1257a0); text-underline-offset:.2em; }
    .candidate [hidden] { display:none!important; }
    .candidate :is(pre,code) { overflow-wrap:anywhere; } .candidate pre { overflow:auto; }
    .candidate :is(section,article,figure,div) { min-width:0; }
    .candidate :is(h1,h2,h3,p,figure) { margin:0 0 .75rem; }
    .candidate h1 { font-size:1.5rem; } .candidate h2 { font-size:1.25rem; }
    .candidate small { font-size:.875rem; } .candidate table { border-collapse:collapse; }
    .candidate :is(th,td) { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #a8adb3; }
    .candidate [atl-key] { scroll-margin-block:5rem; }
    .review-filter .filters { position:sticky; top:0; background:var(--candidate-paper,#fff); display:flex; gap:1rem; padding:.5rem 0; flex-wrap:wrap; }
  </style>
</head>
<body>
<main class="candidate review-filter" data-component="review-filter">
  <p data-demo><small>Beispieldaten · Ohne Kernel wird nichts gespeichert.</small></p>
  <h1>Bereit zur Prüfung</h1>
  <div class="filters"><label>Suchen <input type="search"></label>
    <label>Ansicht <select><option value="pending">Ausstehend</option><option value="all">Alle</option><option value="processing">In Bearbeitung</option></select></label>
    <output aria-live="polite"></output></div>
  <div class="items">
    <article atl-key="video-a" data-ready="true" data-judged="false" data-processing="false"><h2>Video A</h2><p>Bereit, noch nicht bewertet.</p></article>
    <article atl-key="video-b" data-ready="true" data-judged="true" data-processing="false"><h2>Video B</h2><p>Bereits bewertet.</p></article>
    <article atl-key="video-c" data-ready="false" data-judged="false" data-processing="true"><h2>Video C</h2><p>Wird noch erzeugt.</p></article>
  </div><p class="empty" hidden>Kein Treffer für diesen Filter.</p>
</main>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  function filter() {
    const query=root.querySelector('input').value.toLocaleLowerCase(); const view=root.querySelector('select').value;
    const rows=[...root.querySelectorAll('.items article')];
    for(const row of rows) {
      const d=row.dataset; const pending=d.judged!=='true' && d.processing!=='true' && (d.ready==='true'||d.openDecision==='true');
      row.hidden=!row.textContent.toLocaleLowerCase().includes(query) || !(view==='all'||(view==='pending'?pending:d.processing==='true'));
    }
    const count=rows.filter(r=>!r.hidden).length;
    root.querySelector('output').textContent=`${count} / ${rows.length} sichtbar`;
    root.querySelector('.empty').hidden=count>0;
  }
  root.addEventListener('input',filter); root.addEventListener('change',filter); filter();
})();
</script>
</body>
</html>
