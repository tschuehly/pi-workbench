<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Small-multiple sparkline · Atelier candidate</title>
  <!-- Original example; provenance and licence assessment: README.md. -->
  <style>
    .candidate { color:var(--candidate-ink,#20252b); background:var(--candidate-paper,#fff); font:1rem/1.5 system-ui,sans-serif; padding:1rem; }
    .candidate *, .candidate *::before, .candidate *::after { box-sizing:border-box; }
    .candidate :is(button,input,select,textarea) { font:inherit; }
    .candidate button, .candidate select { min-height:2rem; cursor:pointer; }
    .candidate :focus-visible { outline:2px solid var(--candidate-link,#1257a0); outline-offset:3px; }
    .candidate a { color:var(--candidate-link,#1257a0); text-underline-offset:.2em; }
    .candidate [hidden] { display:none!important; }
    .candidate :is(pre,code) { overflow-wrap:anywhere; } .candidate pre { overflow:auto; }
    .candidate :is(section,article,figure,div) { min-width:0; }
    .candidate :is(h1,h2,h3,p,figure) { margin:0 0 .75rem; }
    .candidate h1 { font-size:1.5rem; } .candidate h2 { font-size:1.25rem; }
    .candidate small { font-size:.875rem; } .candidate table { border-collapse:collapse; }
    .candidate :is(th,td) { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #a8adb3; }
    .candidate [atl-key] { scroll-margin-block:5rem; }
    .sparkline svg { display:block; max-width:30rem; width:100%; }
  </style>
</head>
<body>
<main class="candidate sparkline" data-component="sparkline">
  <p data-demo><small>Beispieldaten · Ohne Kernel wird nichts gespeichert.</small></p>
  <figure atl-key="question-example">
    <h1>Passrate je Lauf</h1><svg viewBox="0 0 320 130" role="img" aria-label="Beispiel: 50, 75, fehlend, 100 Prozent"><g class="marks"></g></svg>
    <figcaption>0–100 % · Beispiel · jeder beobachtete Lauf hat 4 Turns</figcaption>
    <table><caption>Rohwerte</caption><tbody><tr><th scope="row">Lauf</th><td>A</td><td>B</td><td>C</td><td>D</td></tr><tr><th scope="row">PASS / Gesamt</th><td atl-key="run-1">2/4</td><td atl-key="run-2">3/4</td><td atl-key="run-3">nicht gemessen</td><td atl-key="run-4">4/4</td></tr></tbody></table>
  </figure>
</main>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const values=[50,75,null,100], g=root.querySelector('g'), ns='http://www.w3.org/2000/svg';
  function mark(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;g.append(e);}
  mark('path',{d:'M30 10V110H310',fill:'none',stroke:'currentColor'});
  mark('text',{x:0,y:15,'font-size':12},'100'); mark('text',{x:15,y:114,'font-size':12},'0');
  values.forEach((v,i)=>{
    if(v===null)return; const x=40+i*85,y=110-v;
    if(i>0 && values[i-1]!==null)mark('line',{x1:x-85,y1:110-values[i-1],x2:x,y2:y,stroke:'currentColor','stroke-width':2});
    mark('circle',{cx:x,cy:y,r:4,fill:'currentColor'});
    mark('text',{x,y:128,'text-anchor':'middle','font-size':12},String.fromCharCode(65+i));
  });
})();
</script>
</body>
</html>
