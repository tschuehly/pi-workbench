<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Named flow path · Atelier candidate</title>
  <!-- Original example; provenance and licence assessment: README.md. -->
  <style>
    .candidate { color:var(--candidate-ink,#20252b); background:var(--candidate-paper,#fff); font:1rem/1.5 system-ui,sans-serif; padding:1rem; }
    .candidate *, .candidate *::before, .candidate *::after { box-sizing:border-box; }
    .candidate :is(button,input,select,textarea) { font:inherit; }
    .candidate button, .candidate select { min-height:2rem; cursor:pointer; }
    .candidate :focus-visible { outline:2px solid var(--candidate-link,#1257a0); outline-offset:3px; }
    .candidate a { color:var(--candidate-link,#1257a0); text-underline-offset:.2em; }
    .candidate [hidden] { display:none!important; }
    .candidate :is(pre,code) { overflow-wrap:anywhere; } .candidate pre { overflow:auto; }
    .candidate :is(section,article,figure,div) { min-width:0; }
    .candidate :is(h1,h2,h3,p,figure) { margin:0 0 .75rem; }
    .candidate h1 { font-size:1.5rem; } .candidate h2 { font-size:1.25rem; }
    .candidate small { font-size:.875rem; } .candidate table { border-collapse:collapse; }
    .candidate :is(th,td) { text-align:left; padding:.4rem .7rem; border-bottom:1px solid #a8adb3; }
    .candidate [atl-key] { scroll-margin-block:5rem; }
    .named-flow svg { width:100%; max-width:50rem; } .named-flow rect { fill:none; stroke:currentColor; } .named-flow text { fill:currentColor; text-anchor:middle; } .named-flow path { stroke:#777; stroke-width:2; } .named-flow path.active { stroke:#1257a0; stroke-width:5; }
  </style>
</head>
<body>
<main class="candidate named-flow" data-component="named-flow">
  <p data-demo><small>Beispieldaten · Ohne Kernel wird nichts gespeichert.</small></p>
  <h1>Welcher Weg wird ausgeführt?</h1>
  <label>Ablauf <select><option value="build">Bauen und prüfen</option><option value="retry">Nur erneut prüfen</option></select></label>
  <svg atl-key="flow" viewBox="0 0 600 110" role="img" aria-label="Bau führt zur Prüfung, Prüfung führt zum Ergebnis">
    <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="currentColor"/></marker></defs>
    <path data-edge="build" d="M170 50H225" marker-end="url(#flow-arrow)"/><path data-edge="retry" d="M390 50H445" marker-end="url(#flow-arrow)"/>
    <g data-node="build"><rect x="10" y="20" width="160" height="60"/><text x="90" y="55">Bau</text></g>
    <g data-node="check"><rect x="225" y="20" width="165" height="60"/><text x="307" y="55">Prüfung</text></g>
    <g data-node="result"><rect x="445" y="20" width="145" height="60"/><text x="517" y="55">Ergebnis</text></g>
  </svg><ol aria-live="polite"></ol>
  <details atl-key="detail"><summary>Was ein Schritt enthält</summary>Actor, Modell, Effort, Befehl, Eingabe, Ausgabe und Quellrevision.</details>
</main>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  const flows={build:['1. Builder erzeugt den Master.','2. Prüfer liest genau diesen Master.','3. Ergebnis bindet dessen Hash.'],retry:['1. Vorhandenen Master lesen.','2. Erneut prüfen; keine neue Produktion.']};
  function show(){const value=root.querySelector('select').value,list=root.querySelector('ol');list.replaceChildren(...flows[value].map((text,i)=>{const li=document.createElement('li');li.setAttribute('atl-key',`${value}-${i+1}`);li.textContent=text;return li;}));root.querySelectorAll('path').forEach(p=>p.classList.toggle('active',value==='build'||p.dataset.edge==='retry'));}
  root.querySelector('select').addEventListener('change',show);show();
})();
</script>
</body>
</html>
